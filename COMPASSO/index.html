<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Compasso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: gaveta lateral + conteúdo. Neo-brutalista jovem: bordas pretas, sombra deslocada, cores só nos status. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F3F3F3; --ink:#0A0A0A; --muted:#5C5C5C; --line:#D4D4D4; --edge:#0A0A0A;
  --acc:#DADADA; --on-acc:#0A0A0A; --hd:#EDEDED; --on-hd:#0A0A0A; --pop:#0A0A0A;
  --b1:#2F343B; --b2:#5B626C; --soft:#E6E9EE; --sh:rgba(34,38,43,.4); --side:#22262B; --hl:#FFE27A; --grid:rgba(60,80,120,.08);
  --ok:#0F6B3C; --ok-bg:#D8F4E4; --bad:#B42318; --bad-bg:#FFE1DE; --warn:#7A4E00; --warn-bg:#FFEFC2; --info:#1F3FBF; --info-bg:#E3EAFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gy:max(16px, env(safe-area-inset-right, 0px));
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.15rem}h3{font-size:.95rem}
small{color:var(--muted)}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--b1);outline:0;box-shadow:0 0 0 4px var(--soft)}
[hidden]{display:none!important}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px var(--gy) 24px var(--gx);background:radial-gradient(circle at 15% 10%,var(--hl),transparent 38%),radial-gradient(circle at 85% 90%,var(--soft),transparent 50%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:30px;padding:28px;box-shadow:0 30px 60px -24px var(--sh);display:grid;gap:14px;animation:pop .5s var(--spring)}
.brand{display:flex;align-items:center;gap:10px;font:700 1.5rem var(--f-display);letter-spacing:-.04em}
.brand svg{color:var(--b1)}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;border:2px solid var(--edge)}
.demo{background:var(--soft);border:2px dashed var(--b1);border-radius:16px;padding:12px;font-size:.85rem;display:grid;gap:4px}

/* shell */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);color:#fff;border-right:0;display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px max(14px,env(safe-area-inset-left,0px));overflow:auto;z-index:40}
.side .brand{padding:4px 8px 14px;font-size:1.25rem;color:#fff}.side .brand svg{color:var(--hl)}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent;background:transparent;border-radius:16px;padding:11px 12px;font-weight:600;cursor:pointer;transition:transform .15s var(--spring),background .15s}
.nav svg{width:20px;height:20px;flex:none}
.nav{color:#E9ECF1}.nav:hover{background:rgba(255,255,255,.12)}
.nav:active{transform:scale(.96)}
.nav svg{color:var(--hl)}
.nav[aria-current="page"]{background:#fff;color:var(--ink);box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
.nav[aria-current="page"] svg{color:var(--b1)}
.nav .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.72rem;padding:0 6px}
.side .grow{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:rgba(255,255,255,.1);color:#fff}.who small{color:#C9CFD8}
.who b{display:block;line-height:1.2}.who small{display:block}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:12px var(--gy) 12px var(--gx);background:var(--surface);color:var(--ink);border-bottom:1.5px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:4px;background:linear-gradient(90deg,var(--b1),var(--b2))}
.top h1{font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);color:var(--b1);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;transition:transform .15s var(--spring),background .15s}
.ib svg{width:20px;height:20px}
.ib:hover{background:var(--b1);color:#fff}.ib:active{transform:scale(.88)}
.ib .n{position:absolute;top:-8px;right:-8px;background:var(--bad);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.72rem;font-weight:700;border:2px solid var(--surface);padding:0 5px;animation:pop .4s var(--spring)}
.menu-btn,.back-btn{display:none}
.has-back .back-btn{display:grid}
.sim{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:.8rem;padding:6px var(--gy) 6px var(--gx);border-bottom:2px solid var(--edge)}
.view{padding:20px var(--gy) 90px var(--gx);display:grid;gap:16px;max-width:1500px;width:100%;animation:rise .35s var(--spring)}
.view>*{min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}

/* componentes */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:12px;box-shadow:0 16px 34px -20px rgba(10,10,10,.35)}
.card.flat{box-shadow:none;background:var(--soft);border-color:transparent}
.card h3{justify-self:start;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px;margin:0 -4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.stat{border-radius:22px;padding:16px;background:#E8F0FF;display:grid;gap:2px;color:#0B1B33}
.grid>.stat:nth-child(4n+2){background:#FFEAF3;color:#3A0F24}.grid>.stat:nth-child(4n+3){background:#E3F6EC;color:#0C2A1C}.grid>.stat:nth-child(4n+4){background:#FFF1D6;color:#3A2605}.stat small{color:inherit;opacity:.75;font-weight:600}
.stat b{font:700 1.8rem var(--f-display);letter-spacing:-.04em}
.btn{position:relative;overflow:hidden;font-weight:700;font-size:.9rem;padding:11px 18px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(10,10,10,.28),0 12px 22px -10px var(--sh);transition:transform .15s var(--spring),box-shadow .15s,filter .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn svg{width:18px;height:18px}
.btn:hover{transform:translateY(-2px);filter:saturate(1.15) brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(10,10,10,.28)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);text-shadow:none}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--b1),0 3px 0 var(--line)}
.btn.dark{background:linear-gradient(135deg,#1F55C9,#0B73A8);--sh:rgba(31,85,201,.4)}
.btn.ok{background:linear-gradient(135deg,#14804A,#0E7A5F);--sh:rgba(20,128,74,.4)}
.btn.danger{background:linear-gradient(135deg,#C02626,#D63A2F);color:#fff;--sh:rgba(192,38,38,.4)}
.btn.sm{padding:8px 13px;font-size:.8rem;border-radius:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;filter:grayscale(.6)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid currentColor;border-radius:99px;padding:2px 10px;font-weight:700;font-size:.74rem;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--surface);color:var(--ink)}.chip.dash{background:var(--surface);color:var(--muted);border-style:dashed}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);min-height:44px}
textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form .full{grid-column:1/-1}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600;cursor:pointer;background:var(--surface);transition:transform .15s var(--spring),border-color .15s,background .15s}
.pill:active{transform:scale(.94)}
.pill input{accent-color:var(--b1);width:16px;height:16px}
.pill.on,.pill:has(input:checked){background:var(--soft);border-color:var(--b1);color:var(--ink)}
.seg{display:inline-flex;border-radius:99px;padding:4px;background:var(--soft);gap:2px}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;transition:transform .15s var(--spring)}
.seg button:active{transform:scale(.92)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;box-shadow:0 6px 14px -6px var(--sh)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden;border:2px solid var(--edge)}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:30px;height:30px;fill:currentColor;margin-top:9px}
.av.big{width:92px;height:92px}.av.big svg{width:68px;height:68px;margin-top:18px}
.list{display:grid;gap:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item>.g{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
.lc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:transform .15s var(--spring),box-shadow .15s;box-shadow:0 10px 22px -16px rgba(10,10,10,.45)}
.lc:hover{transform:translateY(-2px);box-shadow:0 14px 26px -14px var(--sh)}
.lc:active{transform:scale(.98)}
.lc.st-pontuada{background:var(--info-bg);border-color:transparent}.lc.st-falta_pontuada,.lc.st-remarcar{background:var(--warn-bg);border-color:transparent}.lc.st-confirmada,.lc.st-exp_foi{background:var(--ok-bg);border-color:transparent}.lc.st-falta_confirmada,.lc.st-cancelada_paga{background:var(--bad-bg);border-color:transparent}
.lc .t{font:500 .9rem var(--f-mono);min-width:56px}
.lc .g{flex:1;min-width:0}.lc .g b{display:block;overflow-wrap:anywhere}
.lc.off{background:var(--surface-2);box-shadow:none;border-color:transparent}
.day{display:grid;gap:10px}
.day>h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:700}
.banner{border:2px dashed var(--b1);border-radius:16px;padding:10px 12px;background:var(--soft);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center}
.cal button{min-height:62px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:6px;text-align:left;cursor:pointer;display:grid;align-content:space-between;transition:transform .15s var(--spring)}
.cal button:active{transform:scale(.92)}
.cal button.mute{opacity:.35}
.cal button.blk{background:var(--surface-2);border-style:dashed}
.cal button.today{box-shadow:inset 0 0 0 3px var(--b1);background:var(--soft)}
.cal button b{font-size:.85rem}
.cal button span{font-size:.68rem;font-weight:700;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border-radius:99px;padding:0 7px;justify-self:start}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
.alert svg{color:var(--b1)}
.alert.new{background:var(--warn-bg);border-color:transparent}
.alert svg{width:18px;height:18px;flex:none;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pal{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:76px;border:2px solid var(--edge);border-radius:16px;padding:8px;cursor:pointer;display:grid;gap:6px;justify-items:center;background:var(--surface);font-weight:700;font-size:.78rem;transition:transform .2s var(--spring)}
.sw i{width:100%;height:30px;border-radius:9px;border:2px solid var(--edge)}
.sw:active{transform:scale(.88) rotate(-3deg)}
.sw[aria-pressed="true"]{box-shadow:0 10px 20px -8px var(--sh);transform:translateY(-3px);border-color:var(--b1)}
.next{border-radius:28px;padding:22px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;display:grid;gap:8px;box-shadow:0 20px 40px -18px var(--sh)}
.next .btn{background:#fff;color:var(--ink);text-shadow:none;--sh:rgba(0,0,0,.25)}
.next .big{font:700 2.2rem/1 var(--f-display);letter-spacing:-.05em}
.empty{border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-weight:600}

/* modal, toast, confetti */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.5);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:min(560px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border-radius:28px;padding:22px;box-shadow:0 30px 60px -20px rgba(10,10,10,.55);display:grid;gap:14px;animation:pop .35s var(--spring)}
.dlg .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pwd{font:700 2rem var(--f-mono);letter-spacing:.12em;text-align:center;border:2px dashed var(--edge);border-radius:16px;padding:14px;background:var(--surface-2);user-select:all}
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:600;animation:rise .35s var(--spring);border:2px solid var(--edge)}
.cf{position:fixed;z-index:300;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (min-width:1100px){.view{padding-top:28px;padding-left:max(36px,var(--gx));padding-right:max(36px,var(--gy))}.cal button{min-height:96px}.top{padding-top:16px;padding-bottom:16px}.top h1{font-size:1.25rem}}
.dt{color:var(--muted);font-weight:600;font-size:.85rem;display:none}
@media (min-width:900px){.dt{display:block}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:14px;align-items:start}
.weekgrid .day{background:var(--surface);border-radius:22px;padding:14px;border:1.5px solid var(--line);box-shadow:0 12px 26px -18px rgba(10,10,10,.4)}
.weekgrid .lc{flex-wrap:wrap}.weekgrid .lc .g{flex-basis:60%}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-105%);transition:transform .3s var(--spring)}
  .drawer-open .side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.4)}
  .drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:35;animation:fade .2s}
  .menu-btn{display:grid}
}
@media (max-width:520px){.cal button{min-height:52px;padding:4px}.cal button span{font-size:.6rem;padding:0 4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<div id="app"></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   COMPASSO — versão sem Firebase. Os dados ficam no navegador (localStorage).
   Toda leitura/gravação passa por load()/save(), para trocar por Firestore depois.
   ===================================================================== */
const LS='compasso.v1', SES='compasso.session';
const INSTR=['Canto','Bateria','Teclado','Piano','Musicalização infantil','Guitarra','Violão'];
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MON=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const PALS={
  grafite:{n:'Grafite',v:{'--bg':'#EEF0F3','--surface':'#FFFFFF','--surface-2':'#F3F3F3','--ink':'#0A0A0A','--muted':'#5C5C5C','--line':'#D4D4D4','--edge':'#0A0A0A','--acc':'#DADADA','--on-acc':'#0A0A0A','--hd':'#EDEDED','--on-hd':'#0A0A0A','--b1':'#2F343B','--b2':'#5B626C','--soft':'#E6E9EE','--sh':'rgba(34,38,43,.4)','--side':'#22262B','--hl':'#FFE27A'}},

const fcache={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function feriados(y){if(fcache[y])return fcache[y];
  const f={};const add=(m,d,n)=>{f[y+'-'+pad(m)+'-'+pad(d)]=n};
  add(1,1,'Confraternização Universal');add(4,21,'Tiradentes');add(5,1,'Dia do Trabalho');add(9,7,'Independência do Brasil');add(10,12,'Nossa Senhora Aparecida');add(11,2,'Finados');add(11,15,'Proclamação da República');add(11,20,'Consciência Negra');add(12,25,'Natal');
  const e=easter(y);e.setDate(e.getDate()-2);f[ymd(e)]='Sexta-feira Santa';
  return fcache[y]=f}
function dayInfo(s){
  const y=+s.slice(0,4);const fer=feriados(y)[s];if(fer)return{tipo:'feriado',nome:fer};
  for(const x of db.datas){if(s>=x.ini&&s<=x.fim)return{tipo:x.tipo,nome:x.nome,id:x.id}}

const ACTIVE=['agendada','pontuada','confirmada','falta_pontuada','falta_confirmada','exp_foi','exp_nao'];
const ST={agendada:['neutral','Agendada'],pontuada:['info','Aguardando a secretaria'],confirmada:['ok','Confirmada'],falta_pontuada:['warn','Faltou · aguardando'],falta_confirmada:['bad','Faltou · paga'],remarcar:['warn','Remarcar'],remarcada:['dash','Remarcada'],cancelada_nada:['dash','Cancelada'],cancelada_paga:['bad','Aviso tardio · paga'],sem_aula:['dash','Sem aula'],exp_foi:['ok','Experimental: foi'],exp_nao:['dash','Experimental: não foi']};
const users=()=>db.users, profs=()=>db.users.filter(u=>u.role==='prof'), uget=id=>db.users.find(u=>u.id===id);
const aget=id=>db.alunos.find(a=>a.id===id), gget=id=>db.grupos.find(g=>g.id===id), lget=id=>db.aulas.find(a=>a.id===id);
function titleOf(l){if(l.kind==='exp')return'Aula experimental';if(l.kind==='grupo'){const g=gget(l.grupoId);return g?g.nome:'Grupo'}const a=aget(l.alunoId);return a?a.nome:'Aluno'}
function subOf(l){const end=mint(tmin(l.time)+l.dur);let s=l.time+' – '+end;if(l.kind==='ind'){const a=aget(l.alunoId);if(a)s=a.instr+' · '+s}else if(l.kind==='grupo')s='Aula em grupo · '+s;else s='30 minutos · '+s;return s}
function startOf(l){const d=pd(l.date);const m=tmin(l.time);d.setHours(0,m,0,0);return d}
function overlap(a,b){return a.date===b.date&&tmin(a.time)<tmin(b.time)+b.dur&&tmin(b.time)<tmin(a.time)+a.dur}
function conflictOf(c,ignore){
  for(const x of db.aulas){if(x.id===ignore||!ACTIVE.includes(x.status)&&x.status!=='agendada')continue;
    if(!ACTIVE.includes(x.status))continue;
    if(!overlap(c,x))continue;
    if(x.profId===c.profId)return'O professor já tem aula nesse horário ('+x.time+').';
    if(c.kind==='ind'&&x.kind==='ind'&&c.alunoId&&x.alunoId===c.alunoId)return'O aluno já tem aula nesse horário.';
  }return null}
function monthDates(date){const d=pd(date),wd=d.getDay(),y=d.getFullYear(),m=d.getMonth(),out=[];const x=new Date(y,m,1);while(x.getMonth()===m){if(x.getDay()===wd)out.push(ymd(x));x.setDate(x.getDate()+1)}return out}
function mkSeries(o){
  const dates=o.mes?monthDates(o.date):[o.date];const dur=o.kind==='exp'?30:60;let made=0,skipped=[];
  for(const dt of dates){
    const l={id:uid('l'),profId:o.profId,kind:o.kind,alunoId:o.alunoId||null,grupoId:o.grupoId||null,date:dt,time:o.time,dur,status:'agendada',serie:o.mes?(o.serie||uid('s')):null};
    const c=conflictOf(l);if(c){skipped.push(fmtD(dt)+': '+c);continue}
    const di=dayInfo(dt);if(di){l.status='sem_aula';l.blk=true;l.motivo=(di.tipo==='evento'?'Evento: ':'')+di.nome;if(di.tipo==='evento')l.evt=true}
    db.aulas.push(l);made++}
  return{made,skipped}}
function applyDate(dt){ // data importante criada
  const di=dayInfo(dt);if(!di)return;
  db.aulas.forEach(l=>{if(l.date===dt&&(l.status==='agendada'||l.status==='remarcar')){l.prev=l.status;l.status='sem_aula';l.blk=true;l.motivo=(di.tipo==='evento'?'Evento: ':'')+di.nome;if(di.tipo==='evento')l.evt=true}})}
function releaseDate(dt){const di=dayInfo(dt);db.aulas.forEach(l=>{if(l.date===dt&&l.blk&&l.status==='sem_aula'&&!di){l.status=l.prev||'agendada';l.blk=false;l.evt=false;l.motivo=''}})}

function agInit(){

function vAgenda(){
  agInit();const A=ui.ag,isSec=me.role==='sec';const pid=A.prof;
  const L=db.aulas.filter(l=>l.profId===pid).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let head=`<div class="card"><div class="row sp">
   ${isSec?selF('Professor','agProf',profs().map(p=>({v:p.id,t:p.name})),pid,'data-chg="agProf"'):'<span></span>'}
   <div class="seg" role="group" aria-label="Visão">${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(m=>`<button data-act="agMode" data-v="${m[0]}" aria-pressed="${A.mode===m[0]}">${m[1]}</button>`).join('')}</div></div>
   <div class="row sp"><div class="row"><button class="btn sm ghost" data-act="agPrev">‹</button><button class="btn sm ghost" data-act="agToday">Hoje</button><button class="btn sm ghost" data-act="agNext">›</button></div>
   <b>${agTitle()}</b></div>
   <div class="row">${isSec?`<button class="btn sm" data-act="newAula">${ico('plus')}Marcar horário</button><button class="btn sm ghost" data-act="newExp">${ico('plus')}Aula experimental</button>`:`<button class="btn sm ghost" data-act="closeDayForm" data-d="${A.date}">Não vou dar aula neste dia</button>`}${A.mode==='dia'?`<button class="btn sm dark" data-act="markDay" data-d="${A.date}">Marcar aulas do dia</button>`:''}</div></div>`;
  if(!pid)return head+'<div class="empty">Cadastre um professor para começar a agenda.</div>';
  let body='';
  if(A.mode==='dia')body=dayBlock(A.date,L,isSec);
  else if(A.mode==='semana'){const s=weekStart(A.date);body='<div class="weekgrid">'+[0,1,2,3,4,5,6].map(i=>dayBlock(addD(s,i),L,isSec,true)).join('')+'</div>'}
  else body=monthGrid(A.date,L);
  return head+body}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return ymd(d)}
function agTitle(){const A=ui.ag;if(A.mode==='dia')return fmtDL(A.date);if(A.mode==='semana'){const s=weekStart(A.date);return fmtD(s)+' a '+fmtD(addD(s,6))}const d=pd(A.date);return MON[d.getMonth()]+' de '+d.getFullYear()}
function dayBlock(d,L,isSec,compact){
  const ls=L.filter(l=>l.date===d),di=dayInfo(d);
  return`<div class="day"><h3>${fmtDL(d)}${d===today()?' · hoje':''}</h3>${di?`<div class="banner">${TIPO[di.tipo]}: ${esc(di.nome)}. Sem aula neste dia.</div>`:''}${ls.length?ls.map(l=>lessonRow(l,false)).join(''):`<div class="empty">${compact?'Livre':'Sem aulas neste dia.'}</div>`}</div>`}
function monthGrid(d,L){
  const dt=pd(d),y=dt.getFullYear(),m=dt.getMonth();const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  let h=WD.map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);const s=ymd(x);if(i>=35&&x.getMonth()!==m)break;
    const n=L.filter(l=>l.date===s&&l.status!=='sem_aula').length;const di=dayInfo(s);
    h+=`<button data-act="agDay" data-d="${s}" class="${x.getMonth()!==m?'mute ':''}${di?'blk ':''}${s===today()?'today':''}" aria-label="${fmtDL(s)}"><b>${x.getDate()}</b>${n?`<span>${n} aula${n>1?'s':''}</span>`:(di?`<small style="font-size:.6rem">${esc(TIPO[di.tipo])}</small>`:'<i></i>')}</button>`}
  return`<div class="cal">${h}</div>`}

/* ---------- pagamento ---------- */
function defYm(){const t=now();const d=new Date(t.getFullYear(),t.getMonth()-(t.getDate()>=10?1:1),1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function payroll(ym){
  const evs=db.datas.filter(x=>x.tipo==='evento'&&(mkey(x.ini)===ym||mkey(x.fim)===ym));
  return profs().map(p=>{
    const L=db.aulas.filter(a=>a.profId===p.id&&mkey(a.date)===ym).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const ind=L.filter(l=>l.kind==='ind');
    const r={p,L,dadas:ind.filter(l=>l.status==='confirmada').length,faltas:ind.filter(l=>l.status==='falta_confirmada').length,canc:ind.filter(l=>l.status==='cancelada_paga').length};
    r.horas=r.dadas+r.faltas+r.canc;
    r.naoDadas=L.filter(l=>l.kind!=='exp'&&['cancelada_nada','remarcar','remarcada'].includes(l.status)).length;
    r.sem=L.filter(l=>l.status==='sem_aula'&&!l.evt).length;
    r.evDias=new Set(L.filter(l=>l.evt).map(l=>l.date)).size;
    r.aberto=L.filter(l=>l.kind!=='exp'&&['agendada','pontuada','falta_pontuada'].includes(l.status)).length;
    r.gDadas=L.filter(l=>l.kind==='grupo'&&l.status==='confirmada').length;
    if(p.tipo==='grupo'){const gs=db.grupos.filter(g=>g.profId===p.id).map(g=>g.id);r.valor=db.alunos.filter(a=>gs.includes(a.grupoId)).reduce((s,a)=>s+(a.valor||0),0)}
    else r.valor=r.horas*(p.valorHora||0);
    r.extras=db.extras.filter(e=>e.profId===p.id&&e.mes===ym);r.extraSum=r.extras.reduce((s,e)=>s+e.valor,0);
    r.total=r.valor+r.extraSum;r.evs=evs;return r})}
function vPagto(){
  if(!ui.pay.ym)ui.pay.ym=defYm();const ym=ui.pay.ym;const R=payroll(ym);const tot=R.reduce((s,r)=>s+r.total,0);
  const exAll=db.extras.filter(e=>e.mes===ym);
  return`<div class="card"><div class="row sp">${fld('Mês','payYm',ym,'month','data-chg="payYm"')}<div><small>O pagamento fecha todo dia 10, com o mês anterior.</small></div></div></div>
  <div class="card"><div class="row sp"><h3>Folha de pagamento · ${MON[+ym.slice(5)-1]} de ${ym.slice(0,4)}</h3><b>${money(tot)}</b></div>
   <div class="scroll"><table><thead><tr><th>Professor</th><th>Pix</th><th class="r">Aulas pagas</th><th class="r">Não dadas</th><th class="r">Eventos</th><th class="r">Aulas</th><th class="r">Extras</th><th class="r">Total</th></tr></thead><tbody>
   ${R.map(r=>`<tr><td><b>${esc(r.p.name)}</b></td><td>${r.p.pix?esc(r.p.pix):'<small>não cadastrado</small>'}</td><td class="r">${r.p.tipo==='grupo'?'mês cheio':r.horas}</td><td class="r">${r.naoDadas}</td><td class="r">${r.evDias}</td><td class="r">${money(r.valor)}</td><td class="r">${money(r.extraSum)}</td><td class="r"><b>${money(r.total)}</b></td></tr>`).join('')}</tbody></table></div>
   ${R.some(r=>r.aberto)?`<div class="banner">Há aulas ainda sem confirmação neste mês (${R.reduce((s,r)=>s+r.aberto,0)}). Elas não entram no valor até serem confirmadas.</div>`:''}
   <div class="row"><button class="btn" data-act="expFolha" data-f="xlsx">${ico('dl')}Folha em Excel</button><button class="btn" data-act="expFolha" data-f="pdf">${ico('dl')}Folha em PDF</button></div></div>
  <div class="card"><h3>Planilha de controle de aulas</h3><small>Todas as aulas do mês, com a situação de cada uma.</small><div class="row"><button class="btn ghost" data-act="expCtrl" data-f="xlsx">${ico('dl')}Controle em Excel</button><button class="btn ghost" data-act="expCtrl" data-f="pdf">${ico('dl')}Controle em PDF</button></div></div>
  <div class="card"><div class="row sp"><h3>Extras do mês</h3><button class="btn sm" data-act="newExtra">${ico('plus')}Lançar extra</button></div>

  ${CLOUD?'':`<div class="card flat"><h3>Modo de teste</h3><small>Para testar o app como se fosse outra data e hora.</small><div class="form">${fld('Data','simD',ymd(sim),'date')}${fld('Hora','simT',pad(sim.getHours())+':'+pad(sim.getMinutes()),'time')}</div><div class="row"><button class="btn sm" data-act="simSet">Aplicar</button><button class="btn sm ghost" data-act="simReset">Horário real</button></div>

/* ---------- modal da aula ---------- */
function aulaModal(l){
  const p=uget(l.profId),isSec=me.role==='sec',n=now();
  const canMark=true;
  let info=`<div class="row">${chip(l.status)}<span class="chip neutral">${fmtDL(l.date)}</span></div><div><b style="font-size:1.1rem">${esc(titleOf(l))}</b><br><small>${esc(subOf(l))}${isSec&&p?' · '+esc(p.name):''}</small></div>${l.motivo?`<div class="banner">Motivo: ${esc(l.motivo)}</div>`:''}${l.repoOf?'<small>Esta é uma reposição.</small>':''}`;
  let acts=`<button class="btn ghost" data-act="closeModal">Fechar</button>`;
  if(isSec){
    if(l.status==='pontuada')acts=`<button class="btn ok" data-act="confirmAula" data-id="${l.id}">Confirmar aula dada</button>`+acts;
    if(l.status==='falta_pontuada')acts=`<button class="btn ok" data-act="confirmFalta" data-id="${l.id}">Confirmar falta</button>`+acts;
    if(l.status==='remarcar')acts=`<button class="btn" data-act="remForm" data-id="${l.id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${l.id}">Cancelar aula</button>`+acts;
    if(l.status==='agendada'&&canMark){if(l.kind!=='grupo')acts=`<button class="btn danger" data-act="secFalta" data-id="${l.id}">${l.kind==='exp'?'Aluno não foi':'Aluno faltou'}</button>`+acts;acts=`<button class="btn ok" data-act="secDada" data-id="${l.id}">${l.kind==='exp'?'Aluno foi':'Aula dada'}</button>`+acts}
    if(l.status==='agendada'||l.status==='pontuada'||l.status==='falta_pontuada')acts=`<button class="btn ghost" data-act="altForm" data-id="${l.id}">Alterar aula</button>`+acts;
  }else{
    if(l.status==='agendada'){
      if(l.kind==='ind'){
        acts=`<button class="btn ok" data-act="aulaDada" data-id="${l.id}">Aula dada</button><button class="btn danger" data-act="faltaSem" data-id="${l.id}">Aluno faltou</button>`+acts;
      }else if(l.kind==='grupo'){acts=`<button class="btn ok" data-act="grupoOk" data-id="${l.id}">Confirmar aula</button>`+acts;}
      else{acts=`<button class="btn ok" data-act="expFoi" data-id="${l.id}">Aluno foi</button><button class="btn ghost" data-act="expNao" data-id="${l.id}">Aluno não foi</button>`+acts;}
      acts=`<button class="btn ghost" data-act="closeSlotForm" data-id="${l.id}">Aula não dada</button>`+acts}
    if(l.status==='pontuada'||l.status==='falta_pontuada')info+='<small>Aguardando a confirmação da secretaria.</small>'}
  openModal('Aula',info,acts)}

/* ---------- ações ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closeModalBg'){if(e.target.classList.contains('ov'))closeModal();return}
  if(t.classList.contains('btn')||t.classList.contains('ib')){const r=t.getBoundingClientRect();const s=document.createElement('span');s.className='rip';const z=Math.max(r.width,r.height)*2;s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),650)}
  try{act(t.dataset.act,t,e)}catch(err){console.error(err);toast('Algo deu errado. Tente de novo.')}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(!t)return;try{inp(t.dataset.inp,t)}catch(err){console.error(err)}});
function inp(k,t){
  if(k==='aulaBusca')fillAlunoSel();
  else if(k==='alBusca'){const q=nrm(t.value);
    document.querySelectorAll('[data-n]').forEach(r=>{r.hidden=!!q&&!r.dataset.n.includes(q)});
    const res=$('#alRes');if(!res)return;if(!q){res.innerHTML='';return}
    const m=db.alunos.filter(a=>nrm(a.nome).includes(q)).slice(0,10);
    res.innerHTML=m.length?m.map(a=>{const p=uget(a.profId),g=a.grupoId?gget(a.grupoId):null;return`<button class="lc" data-act="alGo" data-id="${a.profId}"><span class="g"><b>${esc(a.nome)}</b><small>${esc(g?g.nome:a.instr)} · ${esc(p?p.name:'')}</small></span><span class="chip neutral">Abrir</span></button>`}).join(''):'<div class="empty">Nenhum aluno com esse nome.</div>'}}
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  try{chg(t.dataset.chg,t)}catch(err){console.error(err)}});

function chg(k,t){
  if(k==='agProf'){ui.ag.prof=t.value;render()}
  else if(k==='alProf'){ui.aluno.prof=t.value;render()}
  else if(k==='payYm'){ui.pay.ym=t.value||defYm();render()}
  else if(k==='photo'){const f=t.files[0];if(f)resizeImg(f,256,d=>{me.photo=d;save();render();toast('Foto atualizada')})}
  else if(k==='logo'){const f=t.files[0];if(f)resizeImg(f,256,d=>{db.school.logo=d;save();render();toast('Logo atualizada')},true)}
  else if(k==='pfTipo'){const g=t.value==='grupo';$('#pfInstrLbl').textContent=g?'Modalidade':'Instrumentos que ensina';$('#pfValWrap').hidden=g;$('#pfInstr').innerHTML=(g?['Dança','Teatro']:INSTR).map(i=>`<label class="pill"><input type="checkbox" value="${i}">${i}</label>`).join('')}
  else if(k==='aulaProf'){fillAlunoSel()}
  else if(k==='altQ'){const a=t.value==='1h';$('#altA').hidden=!a;$('#altB').hidden=a;$('#altHintA').hidden=!a;$('#altHintB').hidden=a}
}
function fillAlunoSel(){const p=uget(val('auProf'));const s=$('#auAluno');if(!s||!p)return;
  const opts=p.tipo==='grupo'?db.grupos.filter(g=>g.profId===p.id).map(g=>({v:'g:'+g.id,t:g.nome})):db.alunos.filter(a=>a.profId===p.id&&!a.grupoId).map(a=>({v:'a:'+a.id,t:a.nome+' · '+a.instr}));
  const q=nrm(val('auBusca'));const f=opts.filter(o=>nrm(o.t).includes(q));
  s.innerHTML=f.length?f.map(o=>`<option value="${esc(o.v)}">${esc(o.t)}</option>`).join(''):`<option value="">${opts.length?'Nenhum nome encontrado':'Cadastre alunos primeiro'}</option>`;
  if(f.length)s.selectedIndex=0}

function act(a,t,ev){
  const id=t&&t.dataset?t.dataset.id:null;
  if(CLOUD&&cloudAct(a,t,id,ev))return;
  switch(a){
  case'closeModal':closeModal();break;
  case'drawer':ui.drawer=!ui.drawer;render();break;
  case'nav':go(t.dataset.v,true);break;
  case'back':if(ui.stack.length>1){ui.stack.pop();render()}break;
  case'bell':go(me.role==='sec'?'painel':'avisos',true);break;
  case'logout':if(CLOUD){cloudLogout();break}try{localStorage.removeItem(SES)}catch(e){}me=null;ui.stack=[{v:'home'}];ui.drawer=false;render();break;
  case'login':if(CLOUD){cloudLogin();break}{const em=norm(val('lgEmail')),pw=val('lgPass');const u=db.users.find(x=>norm(x.email)===em&&x.pass===pw);
    if(!u){toast('E-mail ou senha incorretos.');break}
    me=u;try{localStorage.setItem(SES,u.id)}catch(e){}ui.stack=[{v:u.role==='sec'?'painel':'inicio'}];render();if(u.mustChange)mustChange();break}
  case'forgot':if(CLOUD){forgotForm();break}openModal('Esqueci a senha','<p style="margin:0">Peça à secretaria uma senha provisória. Ela gera uma nova no painel de controle, e você troca por uma sua ao entrar.</p>','<button class="btn" data-act="closeModal">Entendi</button>');break;
  case'readAll':myAlerts().forEach(x=>x.read=true);save();render();break;
  case'goAlunos':go('alunos');break;
  case'alGo':ui.aluno.prof=id;render();break; case'goPagto':go('pagto');break;
  /* agenda */
  case'agMode':ui.ag.mode=t.dataset.v;render();break;
  case'agPrev':case'agNext':{const k=a==='agNext'?1:-1,A=ui.ag;if(A.mode==='dia')A.date=addD(A.date,k);else if(A.mode==='semana')A.date=addD(A.date,7*k);else{const d=pd(A.date);d.setMonth(d.getMonth()+k,1);A.date=ymd(d)}render();break}
  case'agToday':ui.ag.date=today();render();break;
  case'agDay':ui.ag.date=t.dataset.d;ui.ag.mode='dia';render();break;
  case'openAula':{const l=lget(id);if(l)aulaModal(l);break}
  /* professores */
  case'newProf':openModal('Novo professor',profForm(null),'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveProf">Cadastrar</button>');break;
  case'editProf':openModal('Editar professor',profForm(uget(id)),`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveProf" data-id="${id}">Salvar</button>`);break;
  case'saveProf':saveProf(id);break;
  case'resetPass':if(CLOUD){sendResetFor(id);break}{const u=uget(id);const pw=genPass();u.pass=pw;u.mustChange=true;save();openModal('Senha provisória','<p style="margin:0">Passe esta senha para '+esc(u.name)+'. Ele troca por uma sua no primeiro acesso.</p><div class="pwd">'+pw+'</div>','<button class="btn" data-act="closeModal">Pronto</button>');break}
  /* alunos */
  case'addAluno':{const n=val('alNome').trim();if(!n){toast('Escreva o nome do aluno.');break}db.alunos.push({id:uid('a'),profId:ui.aluno.prof,nome:n,instr:val('alInstr')});save();render();toast('Aluno adicionado');break}
  case'addGAluno':{const n=val('gaN'+id).trim(),v=num(val('gaV'+id));if(!n){toast('Escreva o nome do aluno.');break}const g=gget(id);db.alunos.push({id:uid('a'),profId:g.profId,grupoId:id,nome:n,valor:v});save();render();toast('Aluno adicionado ao grupo');break}
  case'delAluno':{const x=aget(id);db.alunos=db.alunos.filter(y=>y.id!==id);db.aulas=db.aulas.filter(l=>!(l.alunoId===id&&l.status==='agendada'&&l.date>=today()));save();render();toast('Aluno removido');break}
  case'newGrupo':openModal('Novo grupo',`<div class="form">${fld('Nome do grupo','grNome','','text','placeholder="Ex.: Ballet infantil"')}</div>`,'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveGrupo">Criar grupo</button>');break;
  case'saveGrupo':{const n=val('grNome').trim();if(!n){toast('Dê um nome ao grupo.');break}db.grupos.push({id:uid('g'),profId:ui.aluno.prof,nome:n});save();closeModal();render();toast('Grupo criado');break}
  case'delGrupo':db.grupos=db.grupos.filter(g=>g.id!==id);db.alunos=db.alunos.filter(a=>a.grupoId!==id);db.aulas=db.aulas.filter(l=>!(l.grupoId===id&&l.status==='agendada'&&l.date>=today()));save();render();break;
  /* marcar horário */
  case'newAula':aulaForm();break;
  case'saveAula':saveAula();break;
  case'newExp':expForm();break;
  case'saveExp':saveExp();break;
  case'altForm':{const l=lget(id);
    if(l.kind!=='ind'){openModal('Alterar aula',`<div><b>${esc(titleOf(l))}</b><br><small>${fmtD(l.date)} · ${esc(subOf(l))}</small></div><p style="margin:0">O que você quer fazer?</p>`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn" data-act="remForm" data-id="${id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${id}">Cancelar aula</button>`);break}
    const antes=now().getTime()<startOf(l).getTime()-3600000;
    openModal('Alterar aula',`<div><b>${esc(titleOf(l))}</b><br><small>${fmtD(l.date)} · ${esc(subOf(l))}</small></div>
    <div class="fld"><span>Quando o aluno avisou</span><div class="checks"><label class="pill"><input type="radio" name="aQ" value="1h" data-chg="altQ" ${antes?'checked':''}>1 hora ou mais antes</label><label class="pill"><input type="radio" name="aQ" value="menos" data-chg="altQ" ${antes?'':'checked'}>Menos de 1 hora, ou não avisou</label></div></div>
    <small id="altHintA" ${antes?'':'hidden'}>Com 1 hora ou mais de antecedência, a aula pode ser remarcada.</small>
    <small id="altHintB" ${antes?'hidden':''}>Em cima da hora não remarca: o professor recebe como aula dada.</small>`,
    `<button class="btn ghost" data-act="closeModal">Voltar</button><span class="row" id="altA" ${antes?'':'hidden'}><button class="btn" data-act="remForm" data-id="${id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${id}">Cancelar sem repor</button></span><span class="row" id="altB" ${antes?'hidden':''}><button class="btn ok" data-act="lateDada" data-id="${id}">Contar como aula dada</button></span>`);break}
  case'lateDada':{const l=lget(id);l.status='cancelada_paga';l.motivo='Aviso em cima da hora';addAlert(l.profId,'Aula contada como dada (aviso em cima da hora): '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Aula contada como dada para o professor');break}
  case'cancelForm':cancelForm(lget(id));break;
  case'doCancel':doCancel(lget(id));break;
  case'remForm':remForm(lget(id));break;
  case'doRem':doRem(lget(id));break;
  case'confirmAula':{const l=lget(id);l.status='confirmada';save();closeModal();render();toast('Aula confirmada');confetti(ev.clientX,ev.clientY);break}

  case'mkAll':document.querySelectorAll('#mkList input[value=dada]:not(:disabled)').forEach(i=>{i.checked=true});break;
  case'mkNone':document.querySelectorAll('#mkList input[value=nao]').forEach(i=>{i.checked=true});break;
  case'saveMark':saveMark(t.dataset.p,t.dataset.d,ev);break;
  case'confirmAll':{let n=0;db.aulas.forEach(l=>{if(l.status==='pontuada'){l.status='confirmada';n++}else if(l.status==='falta_pontuada'){l.status='falta_confirmada';n++}});save();render();toast(n+' aula'+(n===1?' confirmada':'s confirmadas'));confetti(ev.clientX,ev.clientY);break}
  case'secDada':{const l=lget(id);l.status=l.kind==='exp'?'exp_foi':'confirmada';save();closeModal();render();toast('Aula marcada como dada');confetti(ev.clientX,ev.clientY);break}
  case'secFalta':{const l=lget(id);l.status=l.kind==='exp'?'exp_nao':'falta_confirmada';save();closeModal();render();toast('Falta marcada');break}
  case'confirmFalta':{const l=lget(id);l.status='falta_confirmada';save();closeModal();render();toast('Falta confirmada');break}
  /* professor */
  case'aulaDada':{const l=lget(id);l.status='pontuada';addAlert('sec',(uget(l.profId)||{}).name+' pontuou aula: '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Aula dada. Aguardando a secretaria.');confetti(ev.clientX,ev.clientY);break}
  case'faltaSem':{const l=lget(id);l.status='falta_pontuada';addAlert('sec',(uget(l.profId)||{}).name+' marcou aluno faltou: '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','warn');save();closeModal();render();toast('Falta marcada.');break}
  case'grupoOk':{const l=lget(id);l.status='confirmada';save();closeModal();render();toast('Aula do grupo confirmada');confetti(ev.clientX,ev.clientY);break}
  case'expFoi':case'expNao':{const l=lget(id);l.status=a==='expFoi'?'exp_foi':'exp_nao';addAlert('sec',(uget(l.profId)||{}).name+': aluno '+(a==='expFoi'?'foi':'não foi')+' na aula experimental de '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Registrado');break}
  case'closeSlotForm':{const l=lget(id);openModal('Aula não dada',`<div><b>${fmtD(l.date)} · ${l.time}</b><br><small>${esc(titleOf(l))}</small></div>${areaF('Motivo','csMot','')}`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn danger" data-act="doCloseSlot" data-id="${id}">Informar</button>`);break}

  case'doCloseDay':{const m=val('cdMot').trim();if(!m){toast('Escreva o motivo.');break}const d=t.dataset.d;let n=0;db.aulas.forEach(l=>{if(l.profId===me.id&&l.date===d&&l.status==='agendada'){l.status='remarcar';l.motivo=m;n++}});addAlert('sec',me.name+' fechou o dia '+fmtD(d)+' ('+n+' aula'+(n===1?'':'s')+' para remarcar). Motivo: '+m,'warn');save();closeModal();render();toast('Dia fechado. A secretaria foi avisada.');break}

function saveMark(pid,date,ev){
  const isSec=me.role==='sec';let d=0,f=0,nd=0;
  const L=db.aulas.filter(l=>l.profId===pid&&l.date===date&&l.status==='agendada');
  for(const l of L){if(radio('mk_'+l.id)==='nd'&&!val('mkm_'+l.id).trim()){toast('Escreva o motivo da aula não dada: '+l.time+' · '+titleOf(l)+'.');return}}
  L.forEach(l=>{
    const v=radio('mk_'+l.id);if(!['dada','falta','nd'].includes(v))return;
    if(v==='nd'){l.status='remarcar';l.motivo=val('mkm_'+l.id).trim();nd++;return}
    if(l.kind==='exp')l.status=v==='dada'?'exp_foi':'exp_nao';
    else if(l.kind==='grupo')l.status='confirmada';
    else if(v==='dada')l.status=isSec?'confirmada':'pontuada';
    else l.status=isSec?'falta_confirmada':'falta_pontuada';
    if(v==='dada')d++;else f++});
  const tot=d+f+nd;

  if(!isSec)addAlert('sec',(uget(pid)||{}).name+' marcou '+tot+' aula'+(tot>1?'s':'')+' de '+fmtD(date)+': '+d+' dada'+(d===1?'':'s')+(f?', '+f+' falta'+(f===1?'':'s'):'')+(nd?', '+nd+' não dada'+(nd===1?'':'s'):'')+'.',nd?'warn':'info');
  save();closeModal();render();toast(tot+' aula'+(tot>1?'s marcadas':' marcada')+(isSec?'.':'. A secretaria foi avisada.'));

  if(scope==='so'){
    const di=dayInfo(nd);if(di){toast('Esse dia é '+TIPO[di.tipo].toLowerCase()+': '+di.nome+'.');return}
    const n={id:uid('l'),profId:l.profId,kind:l.kind,alunoId:l.alunoId,grupoId:l.grupoId,date:nd,time:nt,dur:l.dur,status:'agendada',repoOf:l.id};
    const c=conflictOf(n,l.id);if(c){toast(c);return}

    addAlert(l.profId,'Aula remarcada: '+titleOf(l)+' de '+fmtD(l.date)+' '+l.time+' para '+fmtD(nd)+' '+nt+'.','warn');
  }else{
    const delta=Math.round((pd(nd)-pd(l.date))/86400000);const set=seriesOf(l);const moved=[];
    for(const x of set){const n={...x,date:addD(x.date,delta),time:nt};const di=dayInfo(n.date);if(di){toast(fmtD(n.date)+' é '+TIPO[di.tipo].toLowerCase()+'. Escolha outra data.');return}
      const c=conflictOf(n,x.id);if(c){toast(fmtD(n.date)+': '+c);return}moved.push([x,n])}

    addAlert(l.profId,'Horário alterado: '+titleOf(l)+' agora às '+nt+' ('+moved.length+' aulas do mês).','warn')}

async function flush(){clearTimeout(CL.t);while(CL.run)await sleep(40);return await syncNow()}
async function syncNow(){
  if(CL.run)return false;CL.run=true;CL.t=null;let ok=true;
  try{
    const{M,fs}=FB;const ops=[];
    if(me&&me.dono){const s=stable(meSnap());if(s!==CL.shadow.me){ops.push({set:[M.doc(fs,'usuarios',me.id),meSnap(),{merge:true}],after:()=>{CL.shadow.me=s}})}}
    if(CL.ready&&CL.eid){
      const sec=CL.mode==='sec',eid=CL.eid;
      for(const col of(sec?DIFF_SEC:DIFF_PROF)){
        const cur={};db[col].forEach(o=>{cur[o.id]=o});const sh=CL.shadow[col]||{};
        const ref=id=>col==='users'?M.doc(fs,'usuarios',id):M.doc(fs,'escolas',eid,col,id);
        for(const id in cur){const data=cleanOf(col,cur[id]),s=stable(data);if(sh[id]!==s)ops.push({set:[ref(id),data],after:()=>{(CL.shadow[col]=CL.shadow[col]||{})[id]=s}})}
        if(sec)for(const id in sh){if(!cur[id]&&!(col==='users'&&id===CL.uid))ops.push({del:ref(id),after:()=>{delete CL.shadow[col][id]}})}
      }
      if(sec){
        const vm=valMap(),old=CL.val||{};
        for(const id in vm){if(stable(vm[id])!==stable(old[id]||null))ops.push({set:[M.doc(fs,'escolas',eid,'valores',id),vm[id]],after:()=>{CL.val[id]=vm[id]}})}
        for(const id in old){if(!vm[id])ops.push({del:M.doc(fs,'escolas',eid,'valores',id),after:()=>{delete CL.val[id]}})}
        const sc=stable(db.school);if(sc!==CL.shadow.school)ops.push({set:[M.doc(fs,'escolas',eid),{name:db.school.name||'',logo:db.school.logo||''},{merge:true}],after:()=>{CL.shadow.school=sc}});
      }
      const sh=CL.shadow.alertas||{};
      db.alertas.forEach(a=>{if(a.read&&sh[a.id]===false)ops.push({set:[M.doc(fs,'escolas',eid,'alertas',a.id),{read:true},{merge:true}],after:()=>{CL.shadow.alertas[a.id]=true}})});
    }
    for(let i=0;i<ops.length;i+=8){
      const part=ops.slice(i,i+8),b=M.writeBatch(fs);
      part.forEach(o=>{if(o.set)b.set(...o.set);else b.delete(o.del)});

  if(!CL.dirty){const q=CL.q;CL.q=[];q.forEach(f=>f());if(q.length)softRender()}
  return ok}

function newSchoolForm(){openModal('Nova escola',`<div class="form">${fld('Nome da escola','nsEsc','')}${fld('Nome da secretária ou secretário','nsNome','')}${fld('E-mail dela(e)','nsEmail','','email','inputmode="email"')}</div><small>A secretaria recebe um e-mail com o link para criar a senha.</small>`,'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveSchoolNew">Criar escola</button>')}
async function saveSchoolNew(){
  const esc0=val('nsEsc').trim(),nome=val('nsNome').trim(),email=val('nsEmail').trim();
  if(!esc0||!nome||!email){toast('Preencha os três campos.');return}
  toast('Criando a escola…');const{M,fs}=FB;
  try{
    const sid=await createAuthUser(email);const eid='e'+Math.random().toString(36).slice(2,10);
    const b=M.writeBatch(fs);
    b.set(M.doc(fs,'escolas',eid),{name:esc0,logo:'',criadaEm:Date.now()});
    b.set(M.doc(fs,'usuarios',sid),{role:'sec',name:nome,email,escolaId:eid,palette:'grafite',photo:''});
    await b.commit();
    await M.sendPasswordResetEmail(FB.auth,email);
    closeModal();toast('Escola criada. '+nome+' recebeu um e-mail para criar a senha.');
  }catch(e){toast(authErr(e))}}
function cloudAct(a,t,id,ev){
  switch(a){
  case'newSchool':newSchoolForm();return true;
  case'saveSchoolNew':saveSchoolNew();return true;
  case'openSchool':flush().then(()=>startSchool(id,'sec'));return true;
  case'toMaster':flush().then(()=>{stopSchool();startMaster()});return true;
  case'sendResetFor':sendResetFor(id);return true;
  case'sendReset':sendReset(val('fgEmail'));return true;
  }
  return false}
function cloudRender(){
  const app=$('#app');
  if(CL.state==='boot'||CL.state==='load'){document.documentElement.removeAttribute('style');app.innerHTML=loaderView();return true}
  if(CL.state==='master'&&me){applyPalette();app.innerHTML=masterHtml();return true}
  return false}

(async function init(){
  if(CLOUD){
    try{await cloudBoot()}catch(e){console.error(e);CL.err='Não consegui conectar ao servidor. Confira a internet e recarregue a página.';CL.state='boot';render()}
    window.__compasso={get db(){return db},get me(){return me},ui,act,render,mkSeries,CL,flush};
    return}
  load();save();
  let sid=null;try{sid=localStorage.getItem(SES)}catch(e){}
  me=sid?uget(sid)||null:null;
  if(me)ui.stack=[{v:me.role==='sec'?'painel':'inicio'}];
  render();if(me&&me.mustChange)mustChange();
  window.__compasso={get db(){return db},get me(){return me},ui,act,render,mkSeries};
})();
</script>
