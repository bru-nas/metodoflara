<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: gaveta lateral + conteúdo. Neo-brutalista jovem: bordas pretas, sombra deslocada, cores só nos status. */
:root{
  --bg:#F7F1E6; --surface:#FFFCF6; --surface-2:#F2E9D8; --ink:#2B1A0F; --muted:#6A5444; --line:#E3D5BC; --edge:#2B1A0F;
  --acc:#D9B36A; --on-acc:#2B1A0F; --hd:#EFE0BF; --on-hd:#2B1A0F; --pop:#2B1A0F;
  --b1:#9C6F2E; --b2:#6F4A22; --soft:#F0E4CC; --sh:rgba(74,46,24,.38); --side:#33200F; --hl:#E6BE72; --grid:rgba(156,111,46,.07);
  --ok:#0F6B3C; --ok-bg:#D8F4E4; --bad:#B42318; --bad-bg:#FFE1DE; --warn:#7A4E00; --warn-bg:#FFEFC2; --info:#1F3FBF; --info-bg:#E3EAFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gy:max(16px, env(safe-area-inset-right, 0px));
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.15rem}h3{font-size:.95rem}
small{color:var(--muted)}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--b1);outline:0;box-shadow:0 0 0 4px var(--soft)}
[hidden]{display:none!important}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px var(--gy) 24px var(--gx);background:radial-gradient(circle at 15% 10%,var(--hl),transparent 38%),radial-gradient(circle at 85% 90%,var(--soft),transparent 50%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:30px;padding:28px;box-shadow:0 30px 60px -24px var(--sh);display:grid;gap:14px;animation:pop .5s var(--spring)}
.brand{display:flex;align-items:center;gap:10px;font:700 1.5rem var(--f-display);letter-spacing:-.04em}
.brand svg{color:var(--b1)}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;border:2px solid var(--edge)}
.demo{background:var(--soft);border:2px dashed var(--b1);border-radius:16px;padding:12px;font-size:.85rem;display:grid;gap:4px}

/* shell */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);color:#fff;border-right:0;display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px max(14px,env(safe-area-inset-left,0px));overflow:auto;z-index:40}
.side .brand{padding:4px 8px 14px;font-size:1.25rem;color:#fff}.side .brand svg{color:var(--hl)}

function conflictOf(c,ignore){
  for(const x of db.aulas){if(x.id===ignore||!ACTIVE.includes(x.status)&&x.status!=='agendada')continue;

  if(!pid)return head+'<div class="empty">Cadastre um professor para começar a agenda.</div>';
  let body='';
  if(A.mode==='dia')body=dayBlock(A.date,L,isSec);

function weekStart(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return ymd(d)}
function agTitle(){const A=ui.ag;if(A.mode==='dia')return fmtDL(A.date);if(A.mode==='semana'){const s=weekStart(A.date);return fmtD(s)+' a '+fmtD(addD(s,6))}const d=pd(A.date);return MON[d.getMonth()]+' de '+d.getFullYear()}
function dayBlock(d,L,isSec,compact){
  const ls=L.filter(l=>l.date===d),di=dayInfo(d);
  return`<div class="day"><h3>${fmtDL(d)}${d===today()?' · hoje':''}</h3>${di?`<div class="banner">${TIPO[di.tipo]}: ${esc(di.nome)}. Sem aula neste dia.</div>`:''}${ls.length?ls.map(l=>lessonRow(l,false)).join(''):`<div class="empty">${compact?'Livre':'Sem aulas neste dia.'}</div>`}</div>`}
function monthGrid(d,L){
  const dt=pd(d),y=dt.getFullYear(),m=dt.getMonth();const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  let h=WD.map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);const s=ymd(x);if(i>=35&&x.getMonth()!==m)break;
    const n=L.filter(l=>l.date===s&&l.status!=='sem_aula').length;const di=dayInfo(s);
    h+=`<button data-act="agDay" data-d="${s}" class="${x.getMonth()!==m?'mute ':''}${di?'blk ':''}${s===today()?'today':''}" aria-label="${fmtDL(s)}"><b>${x.getDate()}</b>${n?`<span>${n} aula${n>1?'s':''}</span>`:(di?`<small style="font-size:.6rem">${esc(TIPO[di.tipo])}</small>`:'<i></i>')}</button>`}
  return`<div class="cal">${h}</div>`}

function defYm(){const t=now();const d=new Date(t.getFullYear(),t.getMonth()-(t.getDate()>=10?1:1),1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const valeMes=d0=>{const d=pd(d0);if(d.getDate()<=10)d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const valePg=mes=>{const d=pd(mes+'-01');d.setMonth(d.getMonth()+1);return '10/'+pad(d.getMonth()+1)};
function payroll(ym){
  const evs=db.datas.filter(x=>x.tipo==='evento'&&(mkey(x.ini)===ym||mkey(x.fim)===ym));
  return profs().map(p=>{
    const L=db.aulas.filter(a=>a.profId===p.id&&mkey(a.date)===ym).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const ind=L.filter(l=>l.kind==='ind');
    const r={p,L,dadas:ind.filter(l=>l.status==='confirmada'&&!l.desc).length,faltas:ind.filter(l=>l.status==='falta_confirmada').length,canc:ind.filter(l=>l.status==='cancelada_paga').length};
    r.horas=r.dadas+r.faltas+r.canc;
    r.naoDadas=L.filter(l=>l.kind!=='exp'&&['cancelada_nada','remarcar','remarcada'].includes(l.status)).length;
    r.sem=L.filter(l=>l.status==='sem_aula'&&!l.evt).length;
    r.evDias=new Set(L.filter(l=>l.evt).map(l=>l.date)).size;
    r.aberto=L.filter(l=>l.kind!=='exp'&&['agendada','pontuada','falta_pontuada'].includes(l.status)).length;
    r.gDadas=L.filter(l=>l.kind==='grupo'&&l.status==='confirmada').length;
    if(p.tipo==='grupo'){const gs=db.grupos.filter(g=>g.profId===p.id).map(g=>g.id);r.valor=db.alunos.filter(a=>gs.includes(a.grupoId)).reduce((s,a)=>s+(a.valor||0),0)}
    else r.valor=r.horas*(p.valorHora||0);
    r.extras=db.extras.filter(e=>e.profId===p.id&&e.mes===ym);r.extraSum=r.extras.reduce((s,e)=>s+e.valor,0);
    r.desc=ind.filter(l=>l.desc&&!l.repoOf).length;r.vl=(db.vales||[]).filter(v=>v.profId===p.id&&v.status==='aprovado'&&v.mes===ym);r.valeSum=r.vl.reduce((s,v)=>s+v.valor,0);
    r.total=r.valor+r.extraSum-r.valeSum;r.evs=evs;return r})}

function aulaModal(l){
  const p=uget(l.profId),isSec=me.role==='sec',n=now();
  const canMark=true;
  let info=`<div class="row">${chip(l.status)}<span class="chip neutral">${fmtDL(l.date)}</span></div><div><b style="font-size:1.1rem">${esc(titleOf(l))}</b><br><small>${esc(subOf(l))}${isSec&&p?' · '+esc(p.name):''}</small></div>${l.motivo?`<div class="banner">Motivo: ${esc(l.motivo)}</div>`:''}${l.repoOf?'<small>Esta é uma reposição.</small>':''}${l.porNome?`<small>Última alteração: ${esc(l.porNome)} · ${fmtTs(l.porEm)}</small>`:''}`;
  let acts=`<button class="btn ghost" data-act="closeModal">Fechar</button>`;
  if(isSec){
    if(l.status==='pontuada')acts=`<button class="btn ok" data-act="confirmAula" data-id="${l.id}">Confirmar aula dada</button>`+acts;
    if(l.status==='falta_pontuada')acts=`<button class="btn ok" data-act="confirmFalta" data-id="${l.id}">Confirmar falta</button>`+acts;
    if(isSec&&l.desc&&!l.repoOf)info+=`<div class="banner">Aula informada no dia, sem aviso antecipado: está descontada do professor. Se vocês combinaram antes, tire o desconto.</div>`;
    if(isSec&&l.desc&&!l.repoOf)acts=`<button class="btn ghost" data-act="tirarDesc" data-id="${l.id}">Tirar o desconto do professor</button>`+acts;
    if(l.status==='remarcar')acts=`<button class="btn" data-act="remForm" data-id="${l.id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${l.id}">Cancelar aula</button>`+acts;
    if(l.status==='agendada'&&canMark){if(l.kind!=='grupo')acts=`<button class="btn danger" data-act="secFalta" data-id="${l.id}">${l.kind==='exp'?'Aluno não foi':'Aluno faltou'}</button>`+acts;acts=`<button class="btn ok" data-act="secDada" data-id="${l.id}">${l.kind==='exp'?'Aluno foi':'Aula dada'}</button>`+acts}
    if(l.status==='agendada'||l.status==='pontuada'||l.status==='falta_pontuada')acts=`<button class="btn ghost" data-act="altForm" data-id="${l.id}">Alterar aula</button>`+acts;
  }else{
    if(l.status==='agendada'){
      if(l.kind==='ind'){
        acts=`<button class="btn ok" data-act="aulaDada" data-id="${l.id}">Aula dada</button>${travaProf(l)?'':`<button class="btn danger" data-act="faltaSem" data-id="${l.id}">Aluno faltou</button>`}`+acts;
      }else if(l.kind==='grupo'){acts=`<button class="btn ok" data-act="grupoOk" data-id="${l.id}">Confirmar aula</button>`+acts;}
      else{acts=`<button class="btn ok" data-act="expFoi" data-id="${l.id}">Aluno foi</button>${travaProf(l)?'':`<button class="btn ghost" data-act="expNao" data-id="${l.id}">Aluno não foi</button>`}`+acts;}
      if(travaProf(l))info+=`<div class="banner">${MSG_TRAVA}</div>`;else acts=`<button class="btn ghost" data-act="closeSlotForm" data-id="${l.id}">Aula não dada</button>`+acts}
    if(l.status==='pontuada'||l.status==='falta_pontuada')info+='<small>Aguardando a confirmação da secretaria.</small>'}
  openModal('Aula',info,acts)}

/* ---------- ações ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closeModalBg'){if(e.target.classList.contains('ov'))closeModal();return}
  if(t.classList.contains('btn')||t.classList.contains('ib')){const r=t.getBoundingClientRect();const s=document.createElement('span');s.className='rip';const z=Math.max(r.width,r.height)*2;s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),650)}
  try{act(t.dataset.act,t,e)}catch(err){console.error(err);toast('Algo deu errado. Tente de novo.')}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(!t)return;try{inp(t.dataset.inp,t)}catch(err){console.error(err)}});
function inp(k,t){
  if(k==='aulaBusca')fillAlunoSel();
  else if(k==='alBusca'){const q=nrm(t.value);
    document.querySelectorAll('[data-n]').forEach(r=>{r.hidden=!!q&&!r.dataset.n.includes(q)});
    const res=$('#alRes');if(!res)return;if(!q){res.innerHTML='';return}
    const m=db.alunos.filter(a=>nrm(a.nome).includes(q)).slice(0,10);
    res.innerHTML=m.length?m.map(a=>{const p=uget(a.profId),g=a.grupoId?gget(a.grupoId):null;return`<button class="lc" data-act="alGo" data-id="${a.profId}"><span class="g"><b>${esc(a.nome)}</b><small>${esc(g?g.nome:a.instr)} · ${esc(p?p.name:'')}</small></span><span class="chip neutral">Abrir</span></button>`}).join(''):'<div class="empty">Nenhum aluno com esse nome.</div>'}}
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  try{chg(t.dataset.chg,t)}catch(err){console.error(err)}});

function chg(k,t){
  if(k==='regF'){ui.regF=t.value;render()}
  else if(k==='agProf'){ui.ag.prof=t.value;render()}
  else if(k==='alProf'){ui.aluno.prof=t.value;render()}
  else if(k==='resYm'){ui.res=ui.res||{};ui.res.ym=t.value||mkey(today());render()}
  else if(k==='resProf'){ui.res=ui.res||{};ui.res.prof=t.value;render()}
  else if(k==='finYm'){ui.fin=ui.fin||{};ui.fin.ym=t.value||mkey(today());render()}
  else if(k==='payYm'){ui.pay.ym=t.value||defYm();render()}
  else if(k==='photo'){const f=t.files[0];t.value='';if(f)cropImg(f,'photo',d=>{me.photo=d;save();render();toast('Foto atualizada')})}
  else if(k==='logo'){const f=t.files[0];t.value='';if(f)cropImg(f,'logo',d=>{db.school.logo=d;save();render();toast('Logo atualizada')})}
  else if(k==='pfTipo'){const g=t.value==='grupo';$('#pfInstrLbl').textContent=g?'Modalidade':'Instrumentos que ensina';$('#pfValWrap').hidden=g;$('#pfInstr').innerHTML=(g?['Dança','Teatro']:INSTR).map(i=>`<label class="pill"><input type="checkbox" value="${i}">${i}</label>`).join('')}
  else if(k==='aulaProf'){fillAlunoSel()}
  else if(k==='altQ'){const a=t.value==='1h';$('#altA').hidden=!a;$('#altB').hidden=a;$('#altHintA').hidden=!a;$('#altHintB').hidden=a}
}
function fillAlunoSel(){const p=uget(val('auProf'));const s=$('#auAluno');if(!s||!p)return;
  const opts=p.tipo==='grupo'?db.grupos.filter(g=>g.profId===p.id).map(g=>({v:'g:'+g.id,t:g.nome})):db.alunos.filter(a=>a.profId===p.id&&!a.grupoId).map(a=>({v:'a:'+a.id,t:a.nome+' · '+a.instr}));
  const q=nrm(val('auBusca'));const f=opts.filter(o=>nrm(o.t).includes(q));
  s.innerHTML=f.length?f.map(o=>`<option value="${esc(o.v)}">${esc(o.t)}</option>`).join(''):`<option value="">${opts.length?'Nenhum nome encontrado':'Cadastre alunos primeiro'}</option>`;
  if(f.length)s.selectedIndex=0}

function act(a,t,ev){
  const id=t&&t.dataset?t.dataset.id:null;
  if(pwaAct(a,t))return;
  if(CLOUD&&cloudAct(a,t,id,ev))return;
  switch(a){
  case'closeModal':closeModal();break;
  case'drawer':ui.drawer=!ui.drawer;render();break;
  case'nav':go(t.dataset.v,true);break;
  case'back':if(ui.stack.length>1){ui.stack.pop();render()}break;
  case'bell':go(me.role==='sec'?'painel':'avisos',true);break;
  case'logout':if(CLOUD){cloudLogout();break}try{localStorage.removeItem(SES)}catch(e){}me=null;ui.stack=[{v:'home'}];ui.drawer=false;render();break;
  case'login':if(CLOUD){cloudLogin();break}{const em=norm(val('lgEmail')),pw=val('lgPass');const u=db.users.find(x=>norm(x.email)===em&&x.pass===pw);
    if(!u){toast('E-mail ou senha incorretos.');break}
    me=u;try{localStorage.setItem(SES,u.id)}catch(e){}ui.stack=[{v:u.role==='sec'?'painel':'inicio'}];render();if(u.mustChange)mustChange();break}
  case'forgot':if(CLOUD){forgotForm();break}openModal('Esqueci a senha','<p style="margin:0">Peça à secretaria uma senha provisória. Ela gera uma nova no painel de controle, e você troca por uma sua ao entrar.</p>','<button class="btn" data-act="closeModal">Entendi</button>');break;
  case'readAll':myAlerts().forEach(x=>x.read=true);save();render();break;
  case'goAlunos':go('alunos');break;
  case'alGo':ui.aluno.prof=id;render();break; case'goPagto':go('pagto');break;
  /* agenda */
  case'agMode':ui.ag.mode=t.dataset.v;render();break;
  case'agPrev':case'agNext':{const k=a==='agNext'?1:-1,A=ui.ag;if(A.mode==='dia')A.date=addD(A.date,k);else if(A.mode==='semana')A.date=addD(A.date,7*k);else{const d=pd(A.date);d.setMonth(d.getMonth()+k,1);A.date=ymd(d)}render();break}
  case'agToday':ui.ag.date=today();render();break;
  case'agDay':ui.ag.date=t.dataset.d;ui.ag.mode='dia';render();break;
  case'openAula':{const l=lget(id);if(l)aulaModal(l);break}
  /* professores */
  case'newProf':openModal('Novo professor',profForm(null),'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveProf">Cadastrar</button>');break;
  case'editProf':openModal('Editar professor',profForm(uget(id)),`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveProf" data-id="${id}">Salvar</button>`);break;
  case'saveProf':saveProf(id);break;
  case'resetPass':if(CLOUD){sendResetFor(id);break}{const u=uget(id);const pw=genPass();u.pass=pw;u.mustChange=true;save();openModal('Senha provisória','<p style="margin:0">Passe esta senha para '+esc(u.name)+'. Ele troca por uma sua no primeiro acesso.</p><div class="pwd">'+pw+'</div>','<button class="btn" data-act="closeModal">Pronto</button>');break}
  /* alunos */
  case'addAluno':{const n=val('alNome').trim();if(!n){toast('Escreva o nome do aluno.');break}db.alunos.push({id:uid('a'),profId:ui.aluno.prof,nome:n,instr:val('alInstr'),...(SOLO()?{cob:val('alCob')||'aula',preco:num(val('alPreco'))}:{})});save();render();toast('Aluno adicionado');break}
  case'addGAluno':{const n=val('gaN'+id).trim(),v=num(val('gaV'+id));if(!n){toast('Escreva o nome do aluno.');break}const g=gget(id);db.alunos.push({id:uid('a'),profId:g.profId,grupoId:id,nome:n,valor:v});save();render();toast('Aluno adicionado ao grupo');break}
  case'delAluno':{const x=aget(id);db.alunos=db.alunos.filter(y=>y.id!==id);db.aulas=db.aulas.filter(l=>!(l.alunoId===id&&l.status==='agendada'&&l.date>=today()));save();render();toast('Aluno removido');break}
  case'newGrupo':openModal('Novo grupo',`<div class="form">${fld('Nome do grupo','grNome','','text','placeholder="Ex.: Ballet infantil"')}</div>`,'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveGrupo">Criar grupo</button>');break;
  case'saveGrupo':{const n=val('grNome').trim();if(!n){toast('Dê um nome ao grupo.');break}db.grupos.push({id:uid('g'),profId:ui.aluno.prof,nome:n});save();closeModal();render();toast('Grupo criado');break}
  case'delGrupo':db.grupos=db.grupos.filter(g=>g.id!==id);db.alunos=db.alunos.filter(a=>a.grupoId!==id);db.aulas=db.aulas.filter(l=>!(l.grupoId===id&&l.status==='agendada'&&l.date>=today()));save();render();break;
  /* marcar horário */
  case'newAula':aulaForm();break;
  case'saveAula':saveAula();break;
  case'newExp':expForm();break;
  case'saveExp':saveExp();break;
  case'altForm':{const l=lget(id);
    if(l.kind!=='ind'){openModal('Alterar aula',`<div><b>${esc(titleOf(l))}</b><br><small>${fmtD(l.date)} · ${esc(subOf(l))}</small></div><p style="margin:0">O que você quer fazer?</p>`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn" data-act="remForm" data-id="${id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${id}">Cancelar aula</button>`);break}
    const antes=now().getTime()<startOf(l).getTime()-3600000;
    openModal('Alterar aula',`<div><b>${esc(titleOf(l))}</b><br><small>${fmtD(l.date)} · ${esc(subOf(l))}</small></div>
    <div class="fld"><span>Quando o aluno avisou</span><div class="checks"><label class="pill"><input type="radio" name="aQ" value="1h" data-chg="altQ" ${antes?'checked':''}>1 hora ou mais antes</label><label class="pill"><input type="radio" name="aQ" value="menos" data-chg="altQ" ${antes?'':'checked'}>Menos de 1 hora, ou não avisou</label></div></div>
    <small id="altHintA" ${antes?'':'hidden'}>Com 1 hora ou mais de antecedência, a aula pode ser remarcada.</small>
    <small id="altHintB" ${antes?'hidden':''}>Em cima da hora não remarca: o professor recebe como aula dada.</small>`,
    `<button class="btn ghost" data-act="closeModal">Voltar</button><span class="row" id="altA" ${antes?'':'hidden'}><button class="btn" data-act="remForm" data-id="${id}">Remarcar/Repor</button><button class="btn danger" data-act="cancelForm" data-id="${id}">Cancelar sem repor</button></span><span class="row" id="altB" ${antes?'hidden':''}><button class="btn ok" data-act="lateDada" data-id="${id}">Contar como aula dada</button></span>`);break}
  case'lateDada':{const l=lget(id);l.status='cancelada_paga';l.motivo='Aviso em cima da hora';addAlert(l.profId,'Aula contada como dada (aviso em cima da hora): '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Aula contada como dada para o professor');break}
  case'cancelForm':cancelForm(lget(id));break;
  case'doCancel':doCancel(lget(id));break;
  case'resOpen':{ui.res=ui.res||{};ui.res.open=ui.res.open===t.dataset.k?'':t.dataset.k;render();break}
  case'remForm':remForm(lget(id));break;
  case'doRem':doRem(lget(id));break;
  case'confirmAula':{const l=lget(id);l.status='confirmada';save();closeModal();render();toast('Aula confirmada');confetti(ev.clientX,ev.clientY);break}
  case'markDay':markForm(me.role==='sec'?ui.ag.prof:me.id,t.dataset.d||today());break;
  case'mkAll':document.querySelectorAll('#mkList input[value=dada]:not(:disabled)').forEach(i=>{i.checked=true});break;
  case'mkNone':document.querySelectorAll('#mkList input[value=nao]').forEach(i=>{i.checked=true});break;
  case'saveMark':saveMark(t.dataset.p,t.dataset.d,ev);break;
  case'confirmAll':{let n=0;db.aulas.forEach(l=>{if(l.status==='pontuada'){l.status='confirmada';n++}else if(l.status==='falta_pontuada'){l.status='falta_confirmada';n++}});save();render();toast(n+' aula'+(n===1?' confirmada':'s confirmadas'));confetti(ev.clientX,ev.clientY);break}
  case'secDada':{const l=lget(id);l.status=l.kind==='exp'?'exp_foi':'confirmada';save();closeModal();render();toast('Aula marcada como dada');confetti(ev.clientX,ev.clientY);break}
  case'secFalta':{const l=lget(id);l.status=l.kind==='exp'?'exp_nao':'falta_confirmada';save();closeModal();render();toast('Falta marcada');break}
  case'confirmFalta':{const l=lget(id);l.status='falta_confirmada';save();closeModal();render();toast('Falta confirmada');break}
  /* professor */
  case'aulaDada':{const l=lget(id);l.status='pontuada';addAlert('sec',(uget(l.profId)||{}).name+' pontuou aula: '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Aula dada. Aguardando a secretaria.');confetti(ev.clientX,ev.clientY);break}
  case'faltaSem':{const l=lget(id);if(travaProf(l)){toast('O horário já passou. Peça para a secretaria marcar a falta.');break}l.status='falta_pontuada';addAlert('sec',(uget(l.profId)||{}).name+' marcou aluno faltou: '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'.','warn');save();closeModal();render();toast('Falta marcada.');break}
  case'grupoOk':{const l=lget(id);l.status='confirmada';save();closeModal();render();toast('Aula do grupo confirmada');confetti(ev.clientX,ev.clientY);break}
  case'expFoi':case'expNao':{const l=lget(id);if(a==='expNao'&&travaProf(l)){toast('O horário já passou. Peça para a secretaria marcar.');break}l.status=a==='expFoi'?'exp_foi':'exp_nao';addAlert('sec',(uget(l.profId)||{}).name+': aluno '+(a==='expFoi'?'foi':'não foi')+' na aula experimental de '+fmtD(l.date)+' '+l.time+'.','info');save();closeModal();render();toast('Registrado');break}
  case'closeSlotForm':{const l=lget(id);openModal('Aula não dada',`<div><b>${fmtD(l.date)} · ${l.time}</b><br><small>${esc(titleOf(l))}</small></div>${areaF('Motivo','csMot','')}`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn danger" data-act="doCloseSlot" data-id="${id}">Informar</button>`);break}
  case'doCloseSlot':{const m=val('csMot').trim();if(!m){toast('Escreva o motivo.');break}const l=lget(id);if(travaProf(l)){toast('O horário já passou. Peça para a secretaria marcar.');break}l.status='remarcar';l.motivo=m;if(l.date<=today())l.desc=true;addAlert('sec',(uget(l.profId)||{}).name+' informou aula não dada: '+titleOf(l)+' · '+fmtD(l.date)+' '+l.time+'. Motivo: '+m,'warn');save();closeModal();render();toast('Informado. A secretaria foi avisada.');break}
  case'secCloseDayForm':{const d=t.dataset.d||today();const ps=profs();if(!ps.length){toast('Cadastre um professor primeiro.');break}
    openModal('Cancelar o dia do professor',`<div class="form">${selF('Professor','scdProf',ps.map(p=>({v:p.id,t:p.name})),ui.ag.prof||ps[0].id)}${fld('Dia','scdData',d,'date')}</div>${areaF('Motivo','scdMot','')}<small>Todas as aulas ainda agendadas desse dia viram "Para remarcar". Nada é cobrado do aluno e o aluno ganha o prazo de 60 dias para repor. O professor é avisado.</small>`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn danger" data-act="doSecCloseDay">Cancelar o dia</button>`);break}
  case'goFin':go('fin',true);break
  case'doSecCloseDay':{const m=val('scdMot').trim(),pid=val('scdProf'),d=val('scdData');if(!d){toast('Escolha o dia.');break}if(!m){toast('Escreva o motivo.');break}
    let n=0;db.aulas.forEach(l=>{if(l.profId===pid&&l.date===d&&['agendada','pontuada'].includes(l.status)){l.status='remarcar';l.motivo=m;n++}});
    if(!n){toast('Esse professor não tem aulas agendadas neste dia.');break}
    const pn=(uget(pid)||{}).name||'Professor';addAlert(pid,'A secretaria cancelou o seu dia '+fmtD(d)+' ('+n+' aula'+(n===1?'':'s')+'). Motivo: '+m,'warn');
    save();closeModal();render();toast('Dia cancelado: '+n+' aula'+(n===1?'':'s')+' para remarcar.');break}
  case'closeDayForm':{const d=t.dataset.d;openModal('Fechar o dia',`<div><b>${fmtDL(d)}</b></div>${areaF('Motivo','cdMot','')}<small>${d===today()?'Atenção: avisar no próprio dia, sem antecedência, faz o desconto dessas aulas no seu pagamento.':'Avisando com antecedência, as aulas ficam para remarcar e nada é descontado.'}</small>`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn danger" data-act="doCloseDay" data-d="${d}">Fechar o dia</button>`);break}
  case'doCloseDay':{const m=val('cdMot').trim();if(!m){toast('Escreva o motivo.');break}const d=t.dataset.d;if(d<today()){toast('Só dá para fechar o dia de hoje em diante.');break}const pen=d===today();let n=0;db.aulas.forEach(l=>{if(l.profId===me.id&&l.date===d&&l.status==='agendada'&&!passou(l)){l.status='remarcar';l.motivo=m;if(pen)l.desc=true;n++}});addAlert('sec',me.name+' fechou o dia '+fmtD(d)+' ('+n+' aula'+(n===1?'':'s')+' para remarcar'+(pen?', informado no dia: descontar do professor':'')+'). Motivo: '+m,'warn');save();closeModal();render();toast('Dia fechado. A secretaria foi avisada.');break}
  /* datas e avisos */
  case'newData':openModal('Data importante',`<div class="form">${selF('Tipo','dtTipo',[{v:'recesso',t:'Recesso'},{v:'facultativo',t:'Ponto facultativo'},{v:'evento',t:'Evento'}],'evento')}${fld('Nome (no evento, qual é o evento)','dtNome','','text','placeholder="Ex.: Recital de fim de ano"')}${fld('Data inicial','dtIni',today(),'date')}${fld('Data final (se for mais de um dia)','dtFim','','date')}</div><small>Nesses dias as aulas são canceladas, sem reposição e sem pagamento. Todos os professores recebem o aviso.</small>`,'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveData">Salvar</button>');break;
  case'saveData':{const tipo=val('dtTipo'),nome=val('dtNome').trim()||TIPO[tipo],ini=val('dtIni'),fim=val('dtFim')||ini;if(!ini){toast('Escolha a data.');break}if(fim<ini){toast('A data final vem depois da inicial.');break}if(tipo==='evento'&&!val('dtNome').trim()){toast('Escreva qual é o evento.');break}

function markForm(pid,date){
  const isSec=me.role==='sec';
  const L=db.aulas.filter(l=>l.profId===pid&&l.date===date&&l.status==='agendada').sort((a,b)=>a.time.localeCompare(b.time));
  if(!L.length){toast('Não há aulas para marcar neste dia.');return}
  const rows=L.map(l=>{
    const lab=l.kind==='exp'?['Aluno foi','Aluno não foi']:['Aula dada','Aluno faltou'],tp=travaProf(l),hasF=l.kind!=='grupo'&&!tp;
    return`<div class="card flat"><div><b>${l.time} · ${esc(titleOf(l))}</b><br><small>${esc(subOf(l))}</small></div><div class="checks">
     <label class="pill"><input type="radio" name="mk_${l.id}" value="dada" checked>${lab[0]}</label>
     ${hasF?`<label class="pill"><input type="radio" name="mk_${l.id}" value="falta">${lab[1]}</label>`:''}
     ${tp?'':`<label class="pill"><input type="radio" name="mk_${l.id}" value="nd">Aula não dada</label>`}
     <label class="pill"><input type="radio" name="mk_${l.id}" value="nao">Deixar sem marcar</label></div>
     ${tp?`<small>${MSG_TRAVA}</small>`:`<label class="fld"><span>Motivo (só se a aula não foi dada)</span><input type="text" id="mkm_${l.id}" placeholder="Ex.: aluno avisou, professor doente"></label>`}</div>`}).join('');
  openModal('Marcar aulas · '+fmtDL(date),`<div class="row"><button class="btn sm ok" data-act="mkAll">Marcar todas como dadas</button><button class="btn sm ghost" data-act="mkNone">Limpar</button></div><div id="mkList" class="day">${rows}</div><small>${isSec?'As aulas dadas já ficam confirmadas.':'As aulas dadas vão para a confirmação da secretaria.'} As não dadas vão para a secretaria remarcar ou cancelar.</small>`,
   `<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn" data-act="saveMark" data-p="${pid}" data-d="${date}">Salvar marcações</button>`)}
function saveMark(pid,date,ev){
  const isSec=me.role==='sec';let d=0,f=0,nd=0;
  const L=db.aulas.filter(l=>l.profId===pid&&l.date===date&&l.status==='agendada');
  for(const l of L){if(radio('mk_'+l.id)==='nd'&&!val('mkm_'+l.id).trim()){toast('Escreva o motivo da aula não dada: '+l.time+' · '+titleOf(l)+'.');return}}
  L.forEach(l=>{
    const v=radio('mk_'+l.id);if(!['dada','falta','nd'].includes(v))return;if(travaProf(l)&&v!=='dada')return;
    if(v==='nd'){l.status='remarcar';l.motivo=val('mkm_'+l.id).trim();if(me.role==='prof')l.desc=true;nd++;return}
    if(l.kind==='exp')l.status=v==='dada'?'exp_foi':'exp_nao';
    else if(l.kind==='grupo')l.status='confirmada';
    else if(v==='dada')l.status=isSec?'confirmada':'pontuada';
    else l.status=isSec?'falta_confirmada':'falta_pontuada';
    if(v==='dada')d++;else f++});
  const tot=d+f+nd;
  if(!tot){toast('Nenhuma aula marcada.');return}
  if(!isSec)addAlert('sec',(uget(pid)||{}).name+' marcou '+tot+' aula'+(tot>1?'s':'')+' de '+fmtD(date)+': '+d+' dada'+(d===1?'':'s')+(f?', '+f+' falta'+(f===1?'':'s'):'')+(nd?', '+nd+' não dada'+(nd===1?'':'s'):'')+'.',nd?'warn':'info');
  save();closeModal();render();toast(tot+' aula'+(tot>1?'s marcadas':' marcada')+(isSec?'.':'. A secretaria foi avisada.'));
  if(ev)confetti(ev.clientX,ev.clientY)}

function saveProf(id){
  if(CLOUD){saveProfCloud(id);return}
  const nome=val('pfNome').trim(),email=val('pfEmail').trim(),tipo=val('pfTipo');
  if(!nome||!email){toast('Preencha nome e e-mail.');return}
  if(db.users.some(u=>norm(u.email)===norm(email)&&u.id!==id)){toast('Já existe alguém com esse e-mail.');return}
  const instr=[...document.querySelectorAll('#pfInstr input:checked')].map(i=>i.value);
  const vh=tipo==='grupo'?0:num(val('pfVal'));
  if(id){const u=uget(id);Object.assign(u,{name:nome,email,tipo,instr,valorHora:vh});save();closeModal();render();toast('Professor salvo');return}
  const pw=val('pfPass').trim();if(pw.length<6){toast('A senha inicial precisa de 6 caracteres ou mais.');return}
  db.users.push({id:uid('u'),role:'prof',name:nome,email,pass:pw,palette:'compasso',photo:'',pix:'',tipo,instr,valorHora:vh});save();closeModal();render();toast('Professor cadastrado')}

let counter=0;
function rules(op,seg,res,nw,uid){
  counter=0;
  if(!uid)return false;
  const perfil=()=>{counter++;const d=store['usuarios/'+uid];if(!d)throw new Error('sem perfil');return d};
  const ativa=e=>{counter++;const d=store['escolas/'+e];if(!d)return false;return !('bloqueioMs' in d)||Date.now()<d.bloqueioMs||('liberadaMs' in d&&Date.now()<d.liberadaMs)};
  const gestor=e=>{const p=perfil();return p.role==='dono'||(p.role==='sec'&&p.escolaId===e&&ativa(e))};
  const membro=e=>{const p=perfil();return p.role==='dono'||(p.escolaId===e&&ativa(e))};
  const profDe=e=>{const p=perfil();return p.role==='prof'&&p.escolaId===e&&ativa(e)};
  const gerir=(r,n)=>{const p=perfil();return p.role==='dono'||(p.role==='sec'&&r.role==='prof'&&r.escolaId===p.escolaId&&n.role==='prof'&&n.escolaId===p.escolaId)};
  const soCampos=lista=>{const a=nw||{},b=res||{};const ks=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of ks){if(JSON.stringify(a[k])!==JSON.stringify(b[k])&&!lista.includes(k))return false}return true};
  const R=()=>{if(!res)throw new Error('sem resource');return res};
  try{
    let ok=false;
    if(seg[0]==='usuarios'){const id=seg[1];
      if(op==='get')ok=uid===id||perfil().role==='dono'||(perfil().role==='sec'&&perfil().escolaId===R().escolaId);
      else if(op==='list')ok=perfil().role==='dono'||(perfil().role==='sec'&&perfil().escolaId===R().escolaId);
      else if(op==='create')ok=perfil().role==='dono'||(perfil().role==='sec'&&(nw.role==='prof'||nw.role==='sec')&&nw.escolaId===perfil().escolaId);
      else if(op==='update')ok=(uid===id&&soCampos(['name','palette','photo','pix']))||gerir(R(),nw);
      else if(op==='delete')ok=gerir(R(),R());
    }else if(seg[0]==='cobrancas'){ok=perfil().role==='dono';
    }else if(seg[0]==='escolas'){
      const e=seg[1];
      if(seg.length===2){
        if(op==='get')ok=perfil().role==='dono'||perfil().escolaId===e;
        else if(op==='list'||op==='create'||op==='delete')ok=perfil().role==='dono';
        else if(op==='update')ok=perfil().role==='dono'||(gestor(e)&&soCampos(['name','logo']));
      }else{
        const col=seg[2],rd=(op==='get'||op==='list');
        if(col==='alunos'||col==='grupos'){ok=rd?(gestor(e)||(profDe(e)&&R().profId===uid)):gestor(e)}
        else if(col==='aulas'){
          if(rd)ok=gestor(e)||(profDe(e)&&R().profId===uid);
          else if(op==='update')ok=gestor(e)||(profDe(e)&&R().profId===uid&&soCampos(['status','motivo','porId','porNome','porEm'])&&nw.porId===uid);
          else ok=gestor(e)}
        else if(col==='log'){if(rd)ok=gestor(e);else if(op==='create')ok=membro(e)&&nw.porId===uid;else ok=false}
        else if(col==='datas'||col==='avisos'){ok=rd?membro(e):gestor(e)}
        else if(col==='extras'||col==='valores'){ok=gestor(e)}
        else if(col==='alertas'){
          if(rd)ok=gestor(e)||(profDe(e)&&R().to===uid);
          else if(op==='create')ok=membro(e)&&(nw.to==='sec'||gestor(e));
          else if(op==='update')ok=gestor(e)||(profDe(e)&&R().to===uid&&soCampos(['read']));
          else ok=gestor(e)}
      }
    }
    return {ok,counter};
  }catch(err){return {ok:false,counter}}
}

function resProxy(cons){const m={};cons.forEach(c=>{if(c.op==='==')m[c.f]=c.v});return new Proxy(m,{get(t,k){if(k in t)return t[k];throw new Error('campo sem filtro: '+String(k))}})}
function snapOf(ref){
  if(ref.kind==='doc'){const d=store[ref.path];return{id:idOf(ref.path),exists:()=>d!==undefined,data:()=>clone(d)}}
  let docs=Object.keys(store).filter(p=>inCol(ref.path,p)&&match(store[p],ref.cons||[])).sort().map(p=>({id:idOf(p),data:()=>clone(store[p])}));
  for(const c of (ref.cons||[])){if(c.ord)docs.sort((x,y)=>{const a=x.data()[c.ord],b=y.data()[c.ord];return c.dir==='desc'?(b>a?1:b<a?-1:0):(a>b?1:a<b?-1:0)});if(c.lim)docs=docs.slice(0,c.lim)}

M.getDoc=async ref=>{await 0;if(!readCheck(ref))throw perm();return snapOf(ref)};

function applyOps(ops){
  let total=0;const uid=curUid();
  // checa regras contra o estado atual

    const cur=store[o.path];const seg=o.path.split('/');
    let op,nw=null;
    if(o.type==='delete')op='delete';
    else{nw=o.merge&&cur!==undefined?{...cur,...clone(o.data)}:clone(o.data);op=cur===undefined?'create':'update'}

function randomPw(){const a=new Uint8Array(18);crypto.getRandomValues(a);return[...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ'[x%55]).join('')}
async function createAuthUser(email){
  const M=FB.M;let app2=null;try{app2=M.getApp('acessos')}catch(e){}
  if(!app2)app2=M.initializeApp(FB.cfg,'acessos');
  const a2=M.getAuth(app2);
  const cr=await M.createUserWithEmailAndPassword(a2,email,randomPw());
  const id=cr.user.uid;try{await M.signOut(a2)}catch(e){}
  return id}
async function saveProfCloud(id){
  const nome=val('pfNome').trim(),email=val('pfEmail').trim(),tipo=val('pfTipo');
  if(!nome||!email){toast('Preencha nome e e-mail.');return}
  if(!id&&db.users.some(u=>norm(u.email)===norm(email))){toast('Já existe alguém com esse e-mail.');return}
  const instr=[...document.querySelectorAll('#pfInstr input:checked')].map(i=>i.value);
  const vh=tipo==='grupo'?0:num(val('pfVal'));
  if(id){const u=uget(id);Object.assign(u,{name:nome,tipo,instr,valorHora:vh});save();closeModal();render();toast('Professor salvo');return}
  toast('Criando o acesso…');
  try{
    const nid=await createAuthUser(email);
    db.users.push({id:nid,role:'prof',name:nome,email,palette:'compasso',photo:'',pix:'',tipo,instr,valorHora:vh,escolaId:CL.eid});
    save();const ok=await flush();
    if(!ok){toast('O acesso foi criado, mas o cadastro não salvou. Confira a internet e tente "Enviar link de senha".');render();return}
    await FB.M.sendPasswordResetEmail(FB.auth,email);
    closeModal();render();toast('Professor cadastrado. Ele recebeu um e-mail para criar a senha.'+(DEMO?' Na simulação, a senha é 123456.':''));
  }catch(e){toast(authErr(e))}}
async function sendResetFor(id){const u=uget(id)||CL.secs.find(s=>s.id===id);if(!u)return;
  try{await FB.M.sendPasswordResetEmail(FB.auth,u.email);toast('Link enviado para '+u.email+'. Se não chegar, olhe o spam.')}catch(e){toast(authErr(e))}}

/* ---------- painel mestre (a dona) ---------- */

/* ---------- cobrança das escolas ---------- */
const DIAS_AVISO=3,DIAS_BLOQ=20;
const addM=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const dayMs=s=>pd(s).getTime();
const blkF=(prox,lib)=>({bloqueioMs:dayMs(addD(prox,DIAS_BLOQ+1)),liberadaMs:lib?dayMs(addD(lib,1)):0});
const daysTo=(a,b)=>Math.round((pd(b)-pd(a))/86400000);
function cobStatus(e){
  if(!e||!e.proxVenc)return{s:'sem',txt:'Sem cobrança',d:0};
  const d=daysTo(today(),e.proxVenc);
  if(d>DIAS_AVISO)return{s:'ok',txt:'Em dia',d};
  if(d>=0)return{s:'breve',txt:d===0?'Vence hoje':'Vence em '+d+' dia'+(d>1?'s':''),d};
  const at=-d,lib=e.liberadaAte&&today()<=e.liberadaAte;
  if(at>DIAS_BLOQ&&!lib)return{s:'bloq',txt:'Bloqueada · '+at+' dias de atraso',d,atraso:at};
  return{s:'atraso',txt:'Atrasada há '+at+' dia'+(at>1?'s':''),d,atraso:at}}
const isBlocked=()=>CLOUD&&me&&!me.dono&&CL.mode&&cobStatus(db.school).s==='bloq';
function cobBanner(){
  if(!CLOUD||!me||me.dono||me.role!=='sec')return'';const c=cobStatus(db.school);
  if(c.s==='breve')return`<div class="banner">A mensalidade da Compasso ${c.d===0?'vence hoje':'vence em '+c.d+' dia'+(c.d>1?'s':'')} (${fmtD(db.school.proxVenc)}). Fale com o suporte para combinar o pagamento.</div>`;
  if(c.s==='atraso'){const f=DIAS_BLOQ+1-c.atraso;return`<div class="banner" style="border-color:var(--bad);background:var(--bad-bg)">Mensalidade atrasada há ${c.atraso} dia${c.atraso>1?'s':''}. O acesso da escola será suspenso em ${f} dia${f>1?'s':''} se o pagamento não for feito.</div>`}
  return''}
function suspendedView(){return`<div class="login"><div class="bgl" style="background-image:url('${LG_MARK}')"></div><div class="login-card"><img class="lg-full" src="${LG_FULL}" alt="Compasso"><h2 style="margin:0;text-align:center">Acesso suspenso</h2><p style="margin:0;color:var(--muted);text-align:center">A mensalidade da escola está atrasada. Fale com o suporte para regularizar. Assim que o pagamento for registrado, o acesso volta.</p><button class="btn dark" data-act="logout">Sair</button></div></div>`}
async function cobSet(id,cob,esc){const{M,fs}=FB;const b=M.writeBatch(fs);if(cob)b.set(M.doc(fs,'cobrancas',id),cob,{merge:true});if(esc)b.set(M.doc(fs,'escolas',id),esc,{merge:true});await b.commit()}
const escOf=id=>CL.escolas.find(e=>e.id===id)||{};
function cobEditForm(id){const e=escOf(id),c=CL.cob[id]||{};
  openModal('Valor e vencimento · '+(e.name||''),`<div class="form">${fld('Mensalidade (R$)','cbV',c.valor||'','number','step="0.01" min="0" inputmode="decimal"')}${fld('Próximo vencimento','cbD',e.proxVenc||today(),'date')}</div><small>Depois de cada pagamento, o vencimento passa sozinho para o mês seguinte.</small>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="cobSave" data-id="${id}">Salvar</button>`)}
async function cobSave(id){const v=num(val('cbV')),d=val('cbD');if(v<=0||!d){toast('Preencha a mensalidade e o vencimento.');return}
  try{await cobSet(id,{valor:v},{proxVenc:d,liberadaAte:'',...blkF(d,'')});closeModal();toast('Cobrança salva')}catch(e){toast(authErr(e))}}
function cobPayForm(id){const e=escOf(id),c=CL.cob[id]||{};if(!c.valor||!e.proxVenc){toast('Defina primeiro o valor e o vencimento.');cobEditForm(id);return}
  openModal('Marcar como pago',`<div><b>${esc(e.name)}</b><br><small>${money(c.valor)} · vencimento ${fmtD(e.proxVenc)}</small></div><p style="margin:0">Registrar o pagamento de hoje? O próximo vencimento passa para <b>${fmtD(addM(e.proxVenc,1))}</b>.</p>`,`<button class="btn ghost" data-act="closeModal">Voltar</button><button class="btn ok" data-act="cobPay" data-id="${id}">Confirmar pagamento</button>`)}
async function cobPay(id){const e=escOf(id),c=CL.cob[id]||{};if(!c.valor||!e.proxVenc)return;
  try{await cobSet(id,{hist:[...(c.hist||[]),{data:today(),ref:e.proxVenc,valor:c.valor}]},{proxVenc:addM(e.proxVenc,1),liberadaAte:'',...blkF(addM(e.proxVenc,1),'')});closeModal();toast('Pagamento registrado')}catch(x){toast(authErr(x))}}
function cobHistForm(id){const e=escOf(id),h=[...((CL.cob[id]||{}).hist||[])].reverse();
  openModal('Histórico · '+(e.name||''),`<div class="list">${h.map(x=>`<div class="item"><div class="g"><b>${money(x.valor)}</b><small>Pago em ${fmtD(x.data)} · vencimento de ${fmtD(x.ref)}</small></div></div>`).join('')||'<div class="empty">Nenhum pagamento registrado ainda.</div>'}</div>`,'<button class="btn" data-act="closeModal">Fechar</button>')}
async function cobLib(id){try{await cobSet(id,null,{liberadaAte:addD(today(),7),liberadaMs:dayMs(addD(today(),8))});toast('Escola liberada por 7 dias')}catch(e){toast(authErr(e))}}

/* ---------- painel mestre ---------- */
const COBCHIP={ok:'ok',breve:'warn',atraso:'bad',bloq:'bad',sem:'neutral'};
function mEscolas(){
  const cards=CL.escolas.map(e=>{const s=CL.secs.find(x=>x.escolaId===e.id),st=cobStatus(e);
    return`<div class="card"><div class="row">${e.logo?`<img src="${e.logo}" alt="" style="width:48px;height:48px;border-radius:14px;object-fit:cover">`:''}<div style="flex:1;min-width:0"><b style="font-size:1.05rem;overflow-wrap:anywhere">${esc(e.name||'Sem nome')}</b>${e.solo?' <span class="chip warn">Independente</span>':''}<br><small style="overflow-wrap:anywhere">Secretaria: ${s?esc(s.name)+' · '+esc(s.email):'não cadastrada'}</small></div><span class="chip ${COBCHIP[st.s]}">${st.txt}</span></div>
    <div class="row"><button class="btn sm" data-act="openSchool" data-id="${e.id}">Abrir escola</button>${s?`<button class="btn sm ghost" data-act="sendResetFor" data-id="${s.id}">Enviar link de senha</button>`:''}</div></div>`}).join('');
  return`<div class="row sp"><h2>Suas escolas</h2><button class="btn" data-act="newSchool">${ico('plus')}Nova escola</button></div>
   ${cards?`<div class="cards">${cards}</div>`:'<div class="empty">Nenhuma escola ainda. Toque em "Nova escola" para criar a primeira.</div>'}
   <div class="card flat"><h3>Como funciona</h3><small>Cada escola tem uma secretaria. Ela recebe um e-mail para criar a senha e depois cadastra os professores, que também recebem um e-mail. Você pode abrir qualquer escola para ajudar. Em Pagamentos você controla mensalidades e vencimentos.</small></div>`}
function mPagto(){
  const E=CL.escolas,mes=today().slice(0,7);let prev=0,rec=0,atr=0;
  E.forEach(e=>{const c=CL.cob[e.id]||{},st=cobStatus(e);prev+=c.valor||0;if(st.s==='atraso'||st.s==='bloq')atr+=c.valor||0;(c.hist||[]).forEach(h=>{if((h.data||'').slice(0,7)===mes)rec+=h.valor||0})});
  const ord=[...E].sort((a,b)=>(a.proxVenc||'9999').localeCompare(b.proxVenc||'9999'));
  return`<div class="grid"><div class="stat"><small>Previsto por mês</small><b>${money(prev)}</b></div><div class="stat"><small>Recebido neste mês</small><b>${money(rec)}</b></div><div class="stat"><small>Em atraso</small><b>${money(atr)}</b></div></div>
  ${ord.length?`<div class="cards">${ord.map(e=>{const c=CL.cob[e.id]||{},st=cobStatus(e);return`<div class="card"><div class="row sp"><b style="font-size:1.05rem;overflow-wrap:anywhere">${esc(e.name||'Sem nome')}</b>${e.solo?' <span class="chip warn">Independente</span>':''}<span class="chip ${COBCHIP[st.s]}">${st.txt}</span></div>
   <small>${c.valor?money(c.valor)+' por mês · ':''}${e.proxVenc?'próximo vencimento em '+fmtD(e.proxVenc):'defina o valor e o vencimento'}</small>
   <div class="row"><button class="btn sm ok" data-act="cobPayForm" data-id="${e.id}">Marcar como pago</button><button class="btn sm ghost" data-act="cobEdit" data-id="${e.id}">Valor e vencimento</button><button class="btn sm ghost" data-act="cobHist" data-id="${e.id}">Histórico</button>${st.s==='atraso'||st.s==='bloq'?`<button class="btn sm ghost" data-act="cobLib" data-id="${e.id}">Dar 7 dias</button>`:''}</div></div>`}).join('')}</div>`:'<div class="empty">Crie uma escola para controlar os pagamentos.</div>'}
  <div class="card flat"><small>O aviso aparece para a secretaria ${DIAS_AVISO} dias antes do vencimento e todos os dias de atraso. Com mais de ${DIAS_BLOQ} dias de atraso, o acesso da escola é suspenso até você marcar como pago.</small></div>`}
function mPerfil(){return`<div class="cols"><div class="stack"><div class="card"><div class="row">${avatar(me,true)}<div style="display:grid;gap:8px"><b style="font-size:1.1rem">${esc(me.name)}</b><small>${esc(me.email)}</small><label class="btn sm ghost">Escolher foto<input type="file" accept="image/*" id="photoIn" data-chg="photo" hidden></label>${me.photo?'<button class="btn sm ghost" data-act="rmPhoto">Remover foto</button>':''}</div></div><div class="form">${fld('Nome','pfN',me.name)}</div><div class="row"><button class="btn" data-act="saveMe">Salvar perfil</button></div></div></div>
  <div class="stack"><div class="card"><h3>Paleta de cores</h3><div class="pal">${Object.keys(PALS).map(k=>`<button class="sw" data-act="pal" data-v="${k}" aria-pressed="${(me.palette||'compasso')===k}"><i style="background:linear-gradient(135deg,${PALS[k].v['--b1']},${PALS[k].v['--b2']})"></i>${PALS[k].n}</button>`).join('')}</div><small>A paleta vale só para você.</small></div>${installCard()}
  <button class="btn dark" data-act="logout">${ico('out')}Sair deste aparelho</button></div></div>`}
function masterHtml(){
  const v=ui.mv||'escolas',nav=[['escolas','Escolas','home'],['pagto','Pagamentos','sheet'],['perfil','Perfil','user']],T={escolas:'Painel mestre',pagto:'Pagamentos',perfil:'Perfil'};
  const body=v==='pagto'?mPagto():v==='perfil'?mPerfil():mEscolas();
  const late=CL.escolas.filter(e=>['atraso','bloq'].includes(cobStatus(e).s)).length;setBadge(late);if(CL.lastLate!=null&&late>CL.lastLate)notify('Compasso','Há '+late+' escola'+(late>1?'s':'')+' com pagamento atrasado.','late');CL.lastLate=late;
  return`<div class="shell${ui.drawer?' drawer-open':''}"><aside class="side" aria-label="Menu"><div class="brand"><img class="lg-ic" src="${LG_ICON}" alt=""><span>Compasso</span></div>
   ${nav.map(n=>`<button class="nav" data-act="mnav" data-v="${n[0]}" ${n[0]===v?'aria-current="page"':''}>${ico(n[2])}<span>${n[1]}</span>${n[0]==='pagto'&&late?`<span class="n">${late}</span>`:''}</button>`).join('')}
   ${DEMO?'':`<button class="nav" data-act="openDemo">${ico('flag')}<span>Simulação</span></button>`}<div class="grow"></div><div class="who">${avatar(me)}<div><b>${esc(me.name)}</b><small>Dona</small></div></div><button class="nav" data-act="logout">${ico('out')}<span>Sair</span></button></aside><div class="scrim" data-act="drawer"></div>
   <div class="main"><div class="bgl" style="background-image:url('${LG_MARK}')"></div><header class="top"><button class="ib menu-btn" data-act="drawer" aria-label="Abrir menu">${ico('menu')}</button><h1>${T[v]}</h1><span class="dt">${fmtDL(today())}</span><img class="top-logo" src="${LG_ICON}" alt="Compasso"></header>
   <main class="view" id="view">${body}</main></div></div>`}

function newSchoolForm(){openModal('Nova escola',`<div class="form">${selF('Tipo de conta','nsTipo',[{v:'escola',t:'Escola (professores e secretaria)'},{v:'solo',t:'Professor independente'}],'escola')}${fld('Nome da escola ou do estúdio','nsEsc','')}${fld('Nome da secretária ou secretário','nsNome','')}${fld('E-mail dela(e)','nsEmail','','email','inputmode="email"')}</div><small>A secretaria recebe um e-mail com o link para criar a senha. Para professor independente: se o e-mail já for de um professor de escola, o estúdio é ligado ao mesmo login.</small>`,'<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="saveSchoolNew">Criar escola</button>')}
async function saveSchoolNew(){
  const esc0=val('nsEsc').trim(),nome=val('nsNome').trim(),email=val('nsEmail').trim();
  if(!esc0||!nome||!email){toast('Preencha os três campos.');return}
  toast('Criando a escola…');const{M,fs}=FB;
  try{
    const eid0='e'+Math.random().toString(36).slice(2,10);
    if(val('nsTipo')==='solo'){
      const q=await M.getDocs(M.query(M.collection(fs,'usuarios'),M.where('email','==',email)));
      if(q.docs&&q.docs.length){const ex=q.docs[0],u=ex.data();
        if(u.role==='dono'){toast('Esse e-mail é o da dona do app.');return}
        const b0=M.writeBatch(fs);
        b0.set(M.doc(fs,'escolas',eid0),{name:esc0,logo:'',criadaEm:Date.now(),solo:true});
        b0.set(M.doc(fs,'usuarios',ex.id),{espacos:[...(Array.isArray(u.espacos)?u.espacos:[]),eid0]},{merge:true});
        await b0.commit();closeModal();toast('Estúdio criado e ligado ao login de '+(u.name||email)+'. No app dele aparece "Trocar de espaço".');return}}
    const sid=await createAuthUser(email);const eid=eid0;
    const b=M.writeBatch(fs);
    b.set(M.doc(fs,'escolas',eid),{name:esc0,logo:'',criadaEm:Date.now(),...(val('nsTipo')==='solo'?{solo:true}:{})});
    b.set(M.doc(fs,'usuarios',sid),{role:'sec',name:nome,email,escolaId:eid,palette:'compasso',photo:''});
    await b.commit();
    await M.sendPasswordResetEmail(FB.auth,email);
    closeModal();toast('Escola criada. '+nome+' recebeu um e-mail para criar a senha.'+(DEMO?' Na simulação, a senha é 123456.':''));
  }catch(e){toast(authErr(e))}}
async function openSpaces(){
  const{M,fs}=FB;const items=[];
  for(const sp of(CL.spaces||[])){let n='';try{const sn=await M.getDoc(M.doc(fs,'escolas',sp.eid));n=sn.exists()?(sn.data().name||''):''}catch(e){}
    items.push({...sp,n:n||'Sem nome',lab:sp.mode==='owner'?'Administrador do meu estúdio':sp.mode==='prof'?'Professor(a)':'Secretaria'})}
  const atual=CL.eid,aOwn=!!CL.owner;
  openModal('Trocar de espaço',`<div class="list">${items.map(x=>`<div class="item"><div class="g"><b>${esc(x.n)}</b><small>${x.lab}</small></div>${(x.eid===atual&&(x.mode==='owner')===aOwn)?'<span class="chip ok">Você está aqui</span>':`<button class="btn sm" data-act="goSpace" data-eid="${x.eid}" data-mode="${x.mode}">Entrar</button>`}</div>`).join('')}</div>`,'<button class="btn" data-act="closeModal">Fechar</button>')}
function cloudAct(a,t,id,ev){
  switch(a){
  case'newSchool':newSchoolForm();return true;
  case'saveSchoolNew':saveSchoolNew();return true;
  case'switchSpace':openSpaces();return true;
  case'goSpace':{const eid=t.dataset.eid,md=t.dataset.mode;closeModal();flush().then(()=>{stopSchool();me=null;startSchool(eid,md==='owner'?'sec':md,md==='owner')});return true}
  case'openSchool':flush().then(()=>startSchool(id,'sec'));return true;
  case'toMaster':flush().then(()=>{stopSchool();startMaster()});return true;
  case'sendResetFor':sendResetFor(id);return true;
  case'sendReset':sendReset(val('fgEmail'));return true;
  case'mnav':ui.mv=t.dataset.v;ui.drawer=false;render();return true;
  case'cobEdit':cobEditForm(id);return true;
  case'cobSave':cobSave(id);return true;
  case'cobPayForm':cobPayForm(id);return true;
  case'cobPay':cobPay(id);return true;
  case'cobHist':cobHistForm(id);return true;
  case'cobLib':cobLib(id);return true;
  }
  return false}
function cloudRender(){
  const app=$('#app');
  if(CL.blockedFlag){document.documentElement.removeAttribute('style');app.innerHTML=suspendedView();return true}
  if(CL.state==='boot'||CL.state==='load'){document.documentElement.removeAttribute('style');app.innerHTML=loaderView();return true}
  if(CL.state==='master'&&me){applyPalette();app.innerHTML=masterHtml();return true}
  if(CL.state==='school'&&isBlocked()){applyPalette();app.innerHTML=suspendedView();return true}
  return false}
/* cortina de teatro: abre quando o app está pronto */
function curtain(){
  const c=document.createElement('div');c.id='curtain';
  c.innerHTML=`<div class="cp l"></div><div class="cp r"></div><div class="pel"></div><div class="ct"><img class="lg-full" src="${LG_FULL}" alt="Compasso">${staffHtml()}</div>`;
  document.body.appendChild(c);const t0=Date.now();let opened=false;
  const ready=()=>!CLOUD||['login','master','school'].includes(CL.state);
  const iv=setInterval(()=>{const age=Date.now()-t0;
    if(!opened&&((age>=2800&&ready())||age>12000)){opened=true;c.classList.add('open');setTimeout(()=>{c.classList.add('gone');c.remove()},2400);clearInterval(iv)}},120)}
(async function init(){
  curtain();swReg();
  if(DEMO){const p=document.createElement('div');p.className='demo-pill';p.innerHTML='<span>Modo simulação · dados fictícios, nada vai para a nuvem</span><button data-act="demoReset">Reiniciar</button>';document.body.appendChild(p)}
  if(CLOUD){
    try{await cloudBoot()}catch(e){console.error(e);CL.err='Não consegui conectar ao servidor. Confira a internet e recarregue a página.';CL.state='boot';render()}
    window.__compasso={get db(){return db},get me(){return me},ui,act,render,mkSeries,CL,flush};
    return}
  load();save();
  let sid=null;try{sid=localStorage.getItem(SES)}catch(e){}
  me=sid?uget(sid)||null:null;
  if(me)ui.stack=[{v:me.role==='sec'?'painel':'inicio'}];
  render();if(me&&me.mustChange)mustChange();
  window.__compasso={get db(){return db},get me(){return me},ui,act,render,mkSeries};
})();
